<title>夫婦引き継ぎ書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="app-css">
:root{
  --paper:#F5F1E8; --surface:#FFFDF7; --surface2:#F0EADC; --sunken:#E7DFCE;
  --line:#E2D9C7; --line-strong:#CDC1A9;
  --ink:#3E4540; --ink2:#6E6C5E; --ink3:#9C947F;
  --accent:#4C888C; --accent-press:#3E7376; --accent-ink:#FFFFFF; --accent-soft:#DDEBE9; --accent-line:#9FC6C6;
  --tan:#D9B98C; --tan-soft:#F0E2CC; --brown:#8A7A67;
  --done:#6E9B7A; --caution:#A0564A; --caution-soft:#F6E5DF;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,Menlo,monospace;
  --hair:#3B342B; --skin:#F7E3D1; --coat:#EADDC7; --coat-2:#DACBB0; --eye:#2E5F63;
  --r:12px; --shadow:0 1px 2px rgba(62,69,64,.05),0 10px 26px -16px rgba(62,69,64,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1D1B; --surface:#232724; --surface2:#2A2F2B; --sunken:#151817;
    --line:#363B37; --line-strong:#4A514B;
    --ink:#EDE7DA; --ink2:#B5AF9F; --ink3:#8B8677;
    --accent:#7FC4C6; --accent-press:#9AD4D5; --accent-ink:#122B2C; --accent-soft:#1D3536; --accent-line:#3D6465;
    --tan:#C9A97C; --tan-soft:#3A322A; --brown:#A08D77;
    --done:#8CBE99; --caution:#D69084; --caution-soft:#33221F;
    --hair:#574C3E; --skin:#F2DCC9; --coat:#DACBB2; --coat-2:#C2B298; --eye:#264F53;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#1A1D1B; --surface:#232724; --surface2:#2A2F2B; --sunken:#151817;
  --line:#363B37; --line-strong:#4A514B;
  --ink:#EDE7DA; --ink2:#B5AF9F; --ink3:#8B8677;
  --accent:#7FC4C6; --accent-press:#9AD4D5; --accent-ink:#122B2C; --accent-soft:#1D3536; --accent-line:#3D6465;
  --tan:#C9A97C; --tan-soft:#3A322A; --brown:#A08D77;
  --done:#8CBE99; --caution:#D69084; --caution-soft:#33221F;
  --hair:#574C3E; --skin:#F2DCC9; --coat:#DACBB2; --coat-2:#C2B298; --eye:#264F53;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.85);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.wrap{max-width:1020px;margin:0 auto;padding:0 18px}
.spacer{flex:1}

/* ---------- 上部 ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1020px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.brand-name{font-family:var(--serif);font-weight:700;font-size:15.5px;letter-spacing:.05em;white-space:nowrap}
.tb-pct{font-family:var(--mono);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.progress-line{height:3px;background:var(--sunken)}
.progress-line span{display:block;height:100%;background:linear-gradient(90deg,var(--tan),var(--accent));transition:width .5s ease}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface2);border-color:var(--accent-line)}
.btn:active{transform:translateY(1px)}
.btn-solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-solid:hover{background:var(--accent-press);border-color:var(--accent-press)}
.btn-tan{background:var(--tan);border-color:var(--tan);color:#3E3527}
.btn-tan:hover{background:var(--tan);border-color:var(--brown);filter:brightness(1.04)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink2);padding:8px 11px}
.btn-quiet:hover{background:var(--surface2)}
.btn-sm{padding:5px 13px;font-size:13px}
.btn-lg{padding:13px 24px;font-size:15.5px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- 探偵 ---------- */
.akari{flex:none;display:block}
.ak-hat{fill:var(--tan)}
.ak-band{fill:#8A6B49}
.ak-hair{fill:var(--hair)}
.ak-tip{fill:var(--accent)}
.ak-skin{fill:var(--skin)}
.ak-coat{fill:var(--coat)}
.ak-coat-l{fill:var(--coat-2)}
.ak-inner{fill:var(--skin)}
.ak-eye{fill:var(--eye)}
.ak-spark{fill:#FFFFFF}
.ak-lash{fill:none;stroke:var(--eye);stroke-width:1.9;stroke-linecap:round}
.ak-mouth{fill:none;stroke:#8A5F4C;stroke-width:1.4;stroke-linecap:round}
.ak-mouth-f{fill:#8A5F4C}
.ak-blush{fill:#EFAF9C;opacity:.55}
.ak-glass{fill:#FFFFFF;fill-opacity:.16;stroke:var(--tan);stroke-width:1.5}
.ak-glass-b{stroke:var(--tan);stroke-width:1.5;fill:none}
.ak-cat{fill:var(--brown)}
.ak-cat-eye{fill:var(--accent)}
.ak-cat-t{fill:none;stroke:var(--brown);stroke-width:2.6;stroke-linecap:round}
.ring-bg{fill:none;stroke:var(--sunken);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .7s ease}
.speech{display:flex;gap:13px;align-items:flex-start}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 16px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;background:var(--surface);
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 3px}
.bubble p{margin:0;font-size:14.5px;line-height:1.75}
.bubble .who{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);margin-bottom:3px}

/* ---------- 表紙 ---------- */
.cover{padding:30px 0 6px}
.cover-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--brown);margin:0 0 10px}
.cover-title{font-family:var(--serif);font-weight:700;font-size:clamp(29px,7vw,43px);line-height:1.34;margin:0 0 16px;
  text-wrap:balance;letter-spacing:.02em}
.quote{font-family:var(--serif);font-size:15px;color:var(--ink2);margin:0;padding-left:14px;border-left:2px solid var(--tan)}
.cover-grid{display:grid;gap:22px;margin-top:22px}
@media (min-width:820px){.cover-grid{grid-template-columns:1fr 300px;align-items:start;gap:34px}}
.dial{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.dial-top{display:flex;align-items:center;gap:14px}
.ring{flex:none}
.dial-pct{font-family:var(--mono);font-size:27px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.1}
.dial-sub{font-size:12.5px;color:var(--ink3);line-height:1.5}
.clues{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:15px}
.clue{height:14px;border-radius:4px;background:var(--sunken);border:0;padding:0;cursor:pointer;transition:transform .12s}
.clue:hover{transform:scale(1.25)}
.clue.part{background:var(--tan)}
.clue.full{background:var(--accent)}
.intro{margin:22px 0 0;padding:17px 18px;background:var(--tan-soft);border:1px solid var(--line);border-radius:var(--r)}
.intro h2{font-family:var(--serif);font-size:16px;margin:0 0 7px;font-weight:700}
.intro p{margin:0;white-space:pre-wrap;color:var(--ink2);font-size:14.5px}

/* ---------- 注意・ヒント ---------- */
.notice{display:flex;gap:10px;padding:12px 15px;border-radius:var(--r);background:var(--caution-soft);
  border:1px solid color-mix(in srgb,var(--caution) 28%,transparent);font-size:13.5px;line-height:1.7;margin-bottom:16px}
.notice b{color:var(--caution)}
.hint{padding:12px 15px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line);
  font-size:13.5px;color:var(--ink2);line-height:1.7}

/* ---------- もくじ ---------- */
.list-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.list-head h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:700}
.list-head span{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.12em}
.search{width:100%;max-width:480px;margin:0 0 14px;padding:11px 16px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.seclist{display:grid;gap:9px;padding-bottom:34px}
@media (min-width:680px){.seclist{grid-template-columns:1fr 1fr}}
.seccard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 13px;width:100%;text-align:left;align-items:center;
  padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .12s}
.seccard:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.seccard:active{transform:translateY(1px)}
.sec-idx{grid-column:1;grid-row:1/3;font-family:var(--mono);font-size:11.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums;align-self:start;padding-top:6px}
.sec-name{grid-column:2;grid-row:1;font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.5}
.sec-lead{grid-column:2;grid-row:2;font-size:12.5px;color:var(--ink3);line-height:1.6}
.sec-meter{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:5px;align-self:center}
.sec-pct{font-family:var(--mono);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-bar{width:46px;height:4px;background:var(--sunken);border-radius:2px;overflow:hidden}
.sec-bar b{display:block;height:100%;background:var(--tan);border-radius:2px;transition:width .4s ease}
.sec-bar.full b{background:var(--done)}

/* ---------- 章 ---------- */
.sec-head{padding:22px 0 14px;max-width:740px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-size:13px;
  padding:6px 0;cursor:pointer;font-family:var(--mono);letter-spacing:.05em}
.back:hover{color:var(--accent)}
.sec-title{font-family:var(--serif);font-weight:700;font-size:clamp(23px,5.2vw,30px);margin:5px 0 14px;line-height:1.4}
.sec-title small{font-family:var(--mono);font-size:12.5px;color:var(--ink3);font-weight:400;margin-right:11px}
.secbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0 4px;max-width:740px}
.fields{display:flex;flex-direction:column;gap:0;padding-bottom:130px;max-width:740px}
.field{padding:16px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.f-label{display:block;font-size:14px;font-weight:500;color:var(--ink);margin-bottom:5px}
.f-help{font-size:12.5px;color:var(--ink3);margin:0 0 8px;line-height:1.65}
.f-val{white-space:pre-wrap;word-break:break-word;margin:0}
.f-empty{color:var(--ink3);font-size:14px;margin:0}
.in{display:block;width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:16px;line-height:1.7}
.in:hover{border-color:var(--accent-line)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:64px;overflow:hidden}
.qrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchip{border:1px dashed var(--line-strong);background:transparent;color:var(--ink2);border-radius:999px;
  padding:5px 12px;font-size:13px;cursor:pointer}
.qchip:hover{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent-line)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip-read{display:inline-block;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:3px 13px;font-size:14px;font-weight:500}

/* ---------- くり返し行 ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.row-n{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.row-grid{display:grid;gap:10px}
@media (min-width:620px){.row-grid{grid-template-columns:1fr 1fr}.row-grid .span{grid-column:1/-1}}
.mini-label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.row-read{display:grid;gap:2px 14px;grid-template-columns:auto 1fr;font-size:14.5px;margin:0}
.row-read dt{font-size:12px;color:var(--ink3);padding-top:5px;white-space:nowrap}
.row-read dd{margin:0;white-space:pre-wrap;word-break:break-word}
.del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:12.5px;padding:5px 9px;border-radius:7px}
.del:hover{color:var(--caution);background:var(--caution-soft)}

/* ---------- やること ---------- */
.tasks{display:flex;flex-direction:column;gap:1px}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border:0;border-top:1px solid var(--line);
  cursor:pointer;width:100%;text-align:left;background:none}
.task:first-child{border-top:0}
.tick{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);margin-top:3px;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px}
.task[aria-pressed="true"] .tick{background:var(--done);border-color:var(--done);color:#fff}
.task[aria-pressed="true"] .task-t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.task-t{font-size:15px;line-height:1.65}

/* ---------- 聞き込みモード ---------- */
.ask{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;overflow:auto}
.ask-top{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:12px;z-index:2}
.ask-count{font-family:var(--mono);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ask-body{flex:1;width:100%;max-width:620px;margin:0 auto;padding:26px 18px 140px}
.ask-where{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--brown);margin:0 0 14px}
.ask-q{font-family:var(--serif);font-size:clamp(21px,5.4vw,27px);font-weight:700;line-height:1.5;margin:14px 0 6px}
.ask-help{font-size:13.5px;color:var(--ink3);margin:0 0 18px;line-height:1.7}
.ask .in{font-size:17px;padding:14px 16px}
.ask-foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.ask-foot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ask-done{text-align:center;padding:20px 0}

/* ---------- 保存バー・トースト ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
  padding:11px 18px calc(11px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
.savebar-in{max-width:1020px;margin:0 auto;display:flex;align-items:center;gap:11px}
.savebar-t{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:70;background:var(--ink);color:var(--paper);
  padding:10px 19px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 0;padding:12px 15px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid var(--accent-line);font-size:13.5px}

/* ---------- シート ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(30,34,31,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;
  border:1px solid var(--line);padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 4px;font-weight:700}
.sheet-sub{margin:0 0 16px;color:var(--ink2);font-size:14px}
.menu{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.menu button{display:flex;width:100%;text-align:left;border:0;background:none;padding:13px 9px;border-radius:9px;
  cursor:pointer;font-size:15px}
.menu button:hover{background:var(--surface2)}
.menu small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.5}
.steps{margin:0;padding-left:1.1em;color:var(--ink2);font-size:14px}
.steps li{margin-bottom:8px}

/* ---------- 全文 ---------- */
.full{max-width:740px}
.full h2{font-family:var(--serif);font-size:20px;margin:30px 0 4px;padding-top:18px;border-top:2px solid var(--line);font-weight:700}
.full h2 small{font-family:var(--mono);font-size:12px;color:var(--ink3);font-weight:400;margin-right:10px}
.full .field{padding:10px 0}
@media print{
  .topbar,.savebar,.no-print,.speech{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  .full h2{page-break-after:avoid}.field{page-break-inside:avoid}
}
</style>
<div id="root"></div>

<script id="app-js">
(function(){
"use strict";

var TITLE = "夫婦引き継ぎ書";
var FONT_URL = "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap";
var LS = "endingnote.v1";
var WHO = "燈月 悠 ／ ローファイ探偵";

/* 保管場所のよくある答え（タップで入る） */
var PLACES = ["金庫","寝室の引き出し","仏壇の引き出し","リビングの棚","本棚のファイル","実家","貸金庫"];

/* =======================================================================
   16章
   say  … 探偵のひとこと（吹き出し）
   q    … タップで入る候補
   im   … スマホのキーボード種別
   ======================================================================= */
var SCHEMA = [
{id:"basic", n:"わたしのこと", lead:"名前・住所・身分証のありか",
 say:"まずは基本情報から。手続きの人が最初に聞くのはここ。埋めておくと、あとがぐっと早い。", f:[
  {k:"name", l:"氏名", t:"text"},

/* 進み具合に応じた、表紙のひとこと */
function coverLine(pct){
  if(pct === 0)  return "はじめまして。ここからゆっくり始めよう。全部は埋めなくていい。";
  if(pct < 25)   return "いい滑り出し。続きはいつでも、思い出したときに。";
  if(pct < 50)   return "四分の一を越えた。ここから先は早いよ。";
  if(pct < 75)   return "半分。もう充分に、役に立つ引き継ぎ書になっている。";
  if(pct < 100)  return "あと少し。空欄があっても、それはそれで構わない。";
  return "完璧だ。あとは、ときどき見直すだけでいい。";
}

function el(tag, a, kids){
  var e = document.createElement(tag), k;
  if(a) for(k in a){
    if(!Object.prototype.hasOwnProperty.call(a,k)) continue;
    var v = a[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "text") e.textContent = v;
    else if(k === "svg") e.innerHTML = v;
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  if(kids != null){
    (Array.isArray(kids) ? kids : [kids]).forEach(function(c){
      if(c == null || c === false) return;
      e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function isBlank(v){ return v == null || String(v).trim() === ""; }
function pad2(n){ return n < 10 ? "0" + n : String(n); }
function fmtDateTime(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.getFullYear() + "." + pad2(d.getMonth()+1) + "." + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function fmtDate(v){
  if(!v) return "";
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  return m ? (m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日") : v;
}

function emptyState(){ return { v:1, owner:"", intro:"", updatedAt:"", d:{} }; }
function normalize(o){
  var s = emptyState();
  if(o && typeof o === "object"){
    if(typeof o.owner === "string") s.owner = o.owner;
    if(typeof o.intro === "string") s.intro = o.intro;
    if(typeof o.updatedAt === "string") s.updatedAt = o.updatedAt;
    if(o.d && typeof o.d === "object") s.d = o.d;
  }
  SCHEMA.forEach(function(sec){ if(!s.d[sec.id] || typeof s.d[sec.id] !== "object") s.d[sec.id] = {}; });
  return s;
}
function readEmbedded(){

}

/* ---------- 進み具合 ---------- */
function rowHasContent(row){
  if(!row) return false;
  for(var k in row){ if(!isBlank(row[k])) return true; }
  return false;
}
function taskItems(sec, field){
  var custom = get(sec.id, field.k + "_custom");
  return field.items.concat(Array.isArray(custom) ? custom : []);
}
function fieldFilled(sec, f){
  var v = get(sec.id, f.k);
  if(f.t === "list") return Array.isArray(v) && v.some(rowHasContent);
  return !isBlank(v);
}
function sectionProgress(sec){
  var done = 0, total = 0;
  sec.f.forEach(function(f){
    if(f.t === "tasks"){
      var items = taskItems(sec, f), checked = get(sec.id, f.k + "_done") || {};
      total += items.length;
      items.forEach(function(it){ if(checked[it]) done++; });
      return;
    }
    total += 1;
    if(fieldFilled(sec, f)) done++;
  });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}
function overallProgress(){
  var done = 0, total = 0;
  SCHEMA.forEach(function(sec){ var p = sectionProgress(sec); done += p.done; total += p.total; });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

/* ---------- 保存 ---------- */
function save(){
  if(saving) return;
  state.updatedAt = new Date().toISOString();
  writeDraft();
  if(!artifactNS || localOnly){
    dirty = false; paintSaveBar();
    toast(localOnly ? "この端末に保存した" : "保存した");
    return;
  }
  saving = true; paintSaveBar();
  try {
    sessionStorage.setItem(LS + ".justSaved", "1");
    sessionStorage.setItem(LS + ".route", route);
    sessionStorage.setItem(LS + ".scroll", String(window.scrollY || 0));
  } catch(e){}
  artifactNS.publish(buildDoc(state)).catch(function(err){
    try { sessionStorage.removeItem(LS + ".justSaved"); } catch(e){}
    saving = false; paintSaveBar();
    var code = err && err.code;
    if(code === "conflict"){
      toast("ほかの端末で先に保存された。最新の内容を読み込むよ。");
    } else if(code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared"){
      readOnly = true; mode = "read"; render();
      toast("この引き継ぎ書は閲覧専用。書けるのは、作った人だけ。");
    } else if(code === "too_large"){
      toast("内容が大きすぎて保存できなかった。長い文章を少し減らしてみて。");
    } else if(code === "rate_limited"){
      toast("保存の間隔が短すぎる。少し待ってからもう一度。");
    } else {
      toast("保存できなかった。書いた内容はこの端末に残してある。");
    }
  });
}

    var done = checked(), items = f.items.concat(custom());
    var kids = items.map(function(it, i){
      var isCustom = i >= f.items.length;
      return el("button", { "class":"task", type:"button", "aria-pressed": String(!!done[it]),
        onclick:function(){
          var d = Object.assign({}, checked());
          if(d[it]) delete d[it]; else d[it] = true;
          set(sec.id, f.k + "_done", d); paint();
        }}, [
        el("span", { "class":"tick", text:"✓" }),
        el("span", { "class":"task-t", text: it }),
        (isCustom && editable()) ? el("span", { "class":"spacer" }) : null,
        (isCustom && editable()) ? el("span", { "class":"del", text:"削除", onclick:function(ev){
          ev.stopPropagation();
          set(sec.id, f.k + "_custom", custom().filter(function(x){ return x !== it; })); paint();
        }}) : null
      ]);
    });
    if(editable()){
      kids.push(el("div", { style:"padding-top:14px" }, [
        el("input", { "class":"in", type:"text", placeholder:"自分のやることを足す（Enterで追加）",
          onkeydown:function(e){
            if(e.key !== "Enter") return;
            var v = e.target.value.trim();
            if(!v) return;
            var c = custom().slice(); c.push(v);
            set(sec.id, f.k + "_custom", c); e.target.value = ""; paint();
          }})
      ]));
    }
    host.replaceChildren.apply(host, kids);
  }
  paint();
  return wrap;
}
function fieldNode(sec, f){
  if(f.t === "list") return listField(sec, f);
  if(f.t === "tasks") return tasksField(sec, f);
  return plainField(sec, f);
}

/* ---------- 章の画面 ---------- */
function sectionView(id){
  var idx = secIndex(id);
  if(idx < 0) return coverView();
  var sec = SCHEMA[idx], p = sectionProgress(sec);
  var wrap = el("main", { "class":"wrap" });
  wrap.appendChild(el("div", { "class":"sec-head" }, [
    el("button", { "class":"back", type:"button", text:"← もくじ", onclick:function(){ go("home"); } }),
    el("h1", { "class":"sec-title" }, [ el("small", { text: pad2(idx + 1) }), sec.n ]),
    speech(sec.say, "normal", 56)
  ]));

  var bar = el("div", { "class":"secbar" });
  if(editable()){
    bar.appendChild(el("button", { "class":"btn btn-tan btn-sm", type:"button", text:"この章をひとつずつ",
      onclick:function(){ startAsk(sec.id); } }));
    bar.appendChild(el("button", { "class":"btn btn-sm", type:"button", "aria-pressed": String(onlyEmpty),
      text:"未記入だけ", onclick:function(){ onlyEmpty = !onlyEmpty; render(); } }));
  }
  bar.appendChild(el("span", { "class":"spacer" }));
  bar.appendChild(el("span", { "class":"sec-pct", text:"この章 " + p.pct + "%" }));
  wrap.appendChild(bar);

  if(sec.warn) wrap.appendChild(el("div", { "class":"notice", style:"margin-top:14px;max-width:740px" },
    [ el("span", {}, [ el("b", { text:"注意　" }), sec.warn ]) ]));

  var fields = el("div", { "class":"fields" });
  var shown = sec.f.filter(function(f){
    if(!onlyEmpty || !editable()) return true;
    if(f.t === "tasks") return true;
    return !fieldFilled(sec, f);
  });
  if(!shown.length){
    fields.appendChild(el("div", { style:"padding:22px 0" }, [ speech("この章はもう全部埋まってる。おつかれさま。", "wink", 56) ]));
  }
  shown.forEach(function(f){ fields.appendChild(fieldNode(sec, f)); });

  var nav = el("div", { style:"display:flex;gap:10px;flex-wrap:wrap;padding-top:26px;border-top:1px solid var(--line);margin-top:22px" });
  if(idx > 0) nav.appendChild(el("button", { "class":"btn btn-sm", type:"button", text:"← " + SCHEMA[idx-1].n, onclick:function(){ go("sec:" + SCHEMA[idx-1].id); } }));
  if(idx < SCHEMA.length - 1) nav.appendChild(el("button", { "class":"btn btn-sm", type:"button", text: SCHEMA[idx+1].n + " →", onclick:function(){ go("sec:" + SCHEMA[idx+1].id); } }));
  fields.appendChild(nav);
  wrap.appendChild(fields);
  return wrap;
}

/* ---------- 聞き込みモード ---------- */
var askQ = [], askI = 0, askEl = null;
function buildAskQueue(secId){
  var q = [];
  SCHEMA.forEach(function(sec){
    if(secId && sec.id !== secId) return;
    sec.f.forEach(function(f){
      if(f.t === "list" || f.t === "tasks") return;
      if(fieldFilled(sec, f)) return;
      q.push({ sec: sec, f: f });
    });
  });
  return q;
}
function startAsk(secId){
  askQ = buildAskQueue(secId); askI = 0;
  paintAsk();
}
function closeAsk(){
  if(askEl){ askEl.remove(); askEl = null; }
  document.body.style.overflow = "";
  render();
}
function paintAsk(){
  if(askEl){ askEl.remove(); askEl = null; }
  document.body.style.overflow = "hidden";
  var body;
  if(!askQ.length || askI >= askQ.length){
    var p = overallProgress();
    body = el("div", { "class":"ask-body ask-done" }, [
      speech(askQ.length ? "ここまで。よく書けた、忘れずに保存しておこう。" : "この範囲は、もう空欄がないよ。", "wink", 88),
      el("p", { style:"margin:22px 0 18px;color:var(--ink2)", text:"全体で " + p.pct + "％（" + p.done + " / " + p.total + " 項目）" }),
      el("div", { style:"display:flex;gap:10px;justify-content:center;flex-wrap:wrap" }, [
        (dirty && !localOnly) ? el("button", { "class":"btn btn-solid btn-lg", type:"button", text:"保存する", onclick:function(){ closeAsk(); save(); } }) : null,
        el("button", { "class":"btn btn-lg", type:"button", text:"とじる", onclick: closeAsk })
      ])
    ]);
    askEl = el("div", { "class":"ask" }, [
      el("div", { "class":"ask-top" }, [
        el("span", { "class":"ask-count", text:"聞き込み おわり" }),
        el("span", { "class":"spacer" }),
        el("button", { "class":"btn btn-quiet btn-sm", type:"button", text:"✕", "aria-label":"閉じる", onclick: closeAsk })
      ]), body
    ]);
    document.body.appendChild(askEl);
    return;
  }

  var item = askQ[askI], sec = item.sec, f = item.f;
  var input;
  if(f.t === "choice"){
    input = choiceInput(f, get(sec.id, f.k) || "", function(v){ set(sec.id, f.k, v); setTimeout(next, 260); });
  } else {
    input = textInput(f, get(sec.id, f.k), function(v){ set(sec.id, f.k, v); });
    var real = input.classList && input.classList.contains("in") ? input : input.querySelector(".in");
    if(real && f.t !== "long"){
      real.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); next(); } });
    }
    setTimeout(function(){ if(real) real.focus(); }, 60);
  }
  var fresh = (askI === 0) || (askQ[askI - 1].sec.id !== sec.id);
  body = el("div", { "class":"ask-body" }, [
    el("p", { "class":"ask-where", text: pad2(secIndex(sec.id) + 1) + " " + sec.n }),
    fresh ? speech(sec.say, "think", 54) : null,
    el("h2", { "class":"ask-q", text: f.l }),
    f.h ? el("p", { "class":"ask-help", text: f.h }) : null,
    input
  ]);
  askEl = el("div", { "class":"ask" }, [
    el("div", { "class":"ask-top" }, [
      el("span", { "class":"ask-count", text: (askI + 1) + " / " + askQ.length }),
      el("span", { "class":"spacer" }),
      el("button", { "class":"btn btn-quiet btn-sm", type:"button", text:"✕", "aria-label":"閉じる", onclick: closeAsk })
    ]),
    body,
    el("div", { "class":"ask-foot" }, [
      el("div", { "class":"ask-foot-in" }, [
        el("button", { "class":"btn", type:"button", text:"もどる", disabled: askI === 0 ? "" : null, onclick: prev }),
        el("span", { "class":"spacer" }),
        el("button", { "class":"btn btn-quiet", type:"button", text:"とばす", onclick: next }),
        el("button", { "class":"btn btn-solid", type:"button", text:"次へ", onclick: next })
      ])
    ])
  ]);
  document.body.appendChild(askEl);
  function next(){ askI++; paintAsk(); }
  function prev(){ if(askI > 0){ askI--; paintAsk(); } }
}

/* ---------- 全文 ---------- */
function fullView(){
  var wrap = el("main", { "class":"wrap full" });
  wrap.appendChild(el("div", { "class":"sec-head no-print" }, [
    el("button", { "class":"back", type:"button", text:"← もくじ", onclick:function(){ go("home"); } }),
    el("h1", { "class":"sec-title", text:"全文" }),
    speech("書いてあるところだけを、上から順に。紙で残すなら、ここから印刷して。", "normal", 56),
    el("button", { "class":"btn btn-sm", style:"margin-top:14px", type:"button", text:"印刷する",
      onclick:function(){ try { window.print(); } catch(e){ toast("この画面からは印刷できなかった。"); } } })
  ]));
  wrap.appendChild(el("h2", { style:"border-top:0;margin-top:14px" }, [ el("small", { text:"00" }),
    ownerName() ? ownerName() + "の引き継ぎ書" : "夫婦引き継ぎ書" ]));
  if(!isBlank(state.intro)) wrap.appendChild(el("div", { "class":"field" }, [
    el("span", { "class":"f-label", text:"最初に読む人へ" }), el("p", { "class":"f-val", text: state.intro }) ]));
  wrap.appendChild(el("div", { "class":"field" }, [
    el("span", { "class":"f-label", text:"最終更新" }), el("p", { "class":"f-val", text: fmtDateTime(state.updatedAt) || "—" }) ]));

  SCHEMA.forEach(function(sec, i){
    var body = [];
    sec.f.forEach(function(f){
      var v = get(sec.id, f.k);
      if(f.t === "tasks"){
        var done = get(sec.id, f.k + "_done") || {};
        var items = taskItems(sec, f).filter(function(it){ return !done[it]; });
        if(items.length) body.push(el("div", { "class":"field" }, [
          el("span", { "class":"f-label", text:"まだ終わっていないこと" }),
          el("p", { "class":"f-val", text: items.map(function(x){ return "・" + x; }).join("\n") }) ]));
        return;
      }
      if(f.t === "list"){
        var filled = Array.isArray(v) ? v.filter(rowHasContent) : [];
        if(!filled.length) return;
        var lines = filled.map(function(row){
          return f.c.filter(function(c){ return !isBlank(row[c.k]); })
                    .map(function(c){ return c.l + "：" + row[c.k]; }).join("\n");
        }).join("\n\n");
        body.push(el("div", { "class":"field" }, [ el("span", { "class":"f-label", text: f.l }), el("p", { "class":"f-val", text: lines }) ]));
        return;
      }
      if(isBlank(v)) return;
      body.push(el("div", { "class":"field" }, [ el("span", { "class":"f-label", text: f.l }),
        el("p", { "class":"f-val", text: f.t === "date" ? fmtDate(v) : v }) ]));
    });
    if(!body.length) return;
    wrap.appendChild(el("h2", {}, [ el("small", { text: pad2(i + 1) }), sec.n ]));
    body.forEach(function(b){ wrap.appendChild(b); });
  });
  wrap.appendChild(el("div", { style:"height:80px" }));
  return wrap;
}

/* ---------- シート ---------- */
var openSheetEl = null;
function closeSheet(){ if(openSheetEl){ openSheetEl.remove(); openSheetEl = null; } }
function sheet(title, sub, body){
  closeSheet();
  var box = el("div", { "class":"sheet", role:"dialog", "aria-modal":"true", "aria-label":title,
    onclick:function(e){ e.stopPropagation(); } }, [
    el("h2", { text: title }),
    sub ? el("p", { "class":"sheet-sub", text: sub }) : null,
    body,
    el("div", { style:"display:flex;justify-content:flex-end;padding-top:18px" },
      [ el("button", { "class":"btn btn-sm", type:"button", text:"閉じる", onclick: closeSheet }) ])
  ]);
  openSheetEl = el("div", { "class":"scrim", onclick: closeSheet }, [box]);
  document.body.appendChild(openSheetEl);
}
function menuItem(label, note, fn){
  return el("button", { type:"button", onclick: fn }, [ el("span", {}, [ label, note ? el("small", { text: note }) : null ]) ]);
}
function openMenu(){
  sheet("メニュー", null, el("div", { "class":"menu" }, [
    menuItem("パートナーに渡す", "URLを送れば、相手のスマホでも同じ内容が開ける", openShare),
    menuItem("全文を表示・印刷する", "書いたところだけを一枚にまとめる", function(){ closeSheet(); go("full"); }),
    menuItem("バックアップを保存する", "JSONファイルとして手元に残す", doExport),
    menuItem("バックアップから読み込む", "保存したJSONを取り込む", doImport),
    menuItem("この引き継ぎ書について", "できること・気をつけること", openAbout)
  ]));
}
function openShare(){
  sheet("パートナーに渡す", "このページのURLを送るだけ。アプリを入れてもらう必要はない。", el("div", {}, [
    el("ol", { "class":"steps" }, [
      el("li", { text:"Claude の共有メニューから、このページを共有する。「閲覧のみ」を選べば、相手は読めるが書き換えはできない。" }),
      el("li", { text:"出てきた URL を、パートナーに送る。" }),
      el("li", { text:"相手はスマホのブラウザで開くだけ。もくじから読める。" })
    ]),
    el("div", { "class":"hint", style:"margin-top:6px",
      text:"「最初に読む人へ」「訃報の連絡先」「書類のありか」の三つが埋まっていれば、もう渡す価値のある引き継ぎ書。URL は必ず届く方法で伝えて、この引き継ぎ書があること自体も、口で話しておくと確実。" }),
    el("div", { "class":"notice", style:"margin-top:12px;margin-bottom:0" },
      [ el("span", {}, [ el("b", { text:"渡す前に　" }), "暗証番号・パスワード・口座番号のすべてを書いていないか、もう一度たしかめて。ここは「ありか」を書く場所。" ]) ])
  ]));
}
function openAbout(){
  sheet("この引き継ぎ書について", null, el("div", {}, [
    speech("案内役の燈月悠。書きにくいところは、聞き込みモードで一問ずつ聞くよ。", "smile", 58),
    el("p", { style:"margin:16px 0 12px;color:var(--ink2);font-size:14px",
      text:"16の章に分かれた、夫婦のための引き継ぎ書。書いた内容はこのページ自体に保存され、URLを知っている人だけが開ける。「保存する」を押したときに記録され、押すまではこの端末に下書きとして残る。" }),
    el("div", { "class":"notice", style:"margin-bottom:12px" },
      [ el("span", {}, [ el("b", { text:"法的な効力はない　" }), "財産の分け方を確実に残すなら、遺言書（公正証書遺言、または法務局で保管される自筆証書遺言）が必要。ここは、その手前にある「伝えること」のための場所。" ]) ]),
    el("div", { "class":"hint", text:"バックアップは「メニュー → バックアップを保存する」から JSON で書き出せる。年に一度、見直して書き出しておくと安心。" })
  ]));
}

/* ---------- 書き出し・読み込み ---------- */
function doExport(){
  var json = JSON.stringify(state, null, 2), d = new Date();
  var name = "hikitsugi-" + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + ".json";
  if(downloadsNS){
    downloadsNS.save({ filename: name, data: json }).then(function(){
      closeSheet(); toast("バックアップを保存した");
    }).catch(function(err){
      if(err && err.code === "declined") return;
      showJson(json);
    });
  } else showJson(json);
}
function showJson(json){
  sheet("バックアップ", "この文字列をすべて選んでコピーし、メモアプリなどに貼って保存して。",
    el("textarea", { "class":"in", rows:"10", readonly:"", onclick:function(e){ e.target.select(); } }, json));
}
function doImport(){
  var input = el("input", { type:"file", accept:"application/json,.json", style:"display:none" });
  input.addEventListener("change", function(){
    var file = input.files && input.files[0];
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var parsed = normalize(JSON.parse(String(r.result)));
        if(!window.confirm("いま表示している内容を、読み込んだ内容で置きかえます。よろしいですか？")) return;
        state = parsed; markDirty(); closeSheet(); go("home");
        toast("読み込んだ。内容を確かめて「保存する」を押して。");
      } catch(e){ toast("読み込めなかった。バックアップのファイルか確かめて。"); }
    };
    r.readAsText(file);
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(function(){ input.remove(); }, 0);
}

/* ---------- 保存バー ---------- */
function paintSaveBar(){
  var host = document.getElementById("savebar-host");
  if(!host) return;
  if(!dirty && !saving){ host.replaceChildren(); return; }
  host.replaceChildren(el("div", { "class":"savebar" }, [
    el("div", { "class":"savebar-in" }, [
      el("span", { "class":"savebar-t", text: saving ? "保存している…" : "まだ保存していない変更がある" }),
      (!localOnly && !saving) ? el("button", { "class":"btn btn-sm", type:"button", text:"元にもどす", onclick:function(){
        if(!window.confirm("最後に保存したときの内容にもどします。書きかけの内容は消えます。")) return;
        state = clone(published); clearDraft(); dirty = false; render(); toast("もとにもどした");
      }}) : null,
      el("button", { "class":"btn btn-solid btn-sm", type:"button", text: saving ? "保存中" : "保存する",
        disabled: saving ? "" : null, onclick: save })
    ])
  ]));
}

/* ---------- 描画 ---------- */
function render(){
  var kids = topbar();
  if(restoreOffer){
    kids.push(el("div", { "class":"wrap" }, [ el("div", { "class":"banner" }, [
      el("span", { style:"flex:1;min-width:180px", text:"この端末に、保存していない変更が残っている。" }),
      el("button", { "class":"btn btn-sm", type:"button", text:"反映する", onclick:function(){
        state = restoreOffer.data; restoreOffer = null; dirty = true; render();
        toast("下書きを反映した。確かめて「保存する」を押して。");
      }}),
      el("button", { "class":"btn btn-quiet btn-sm", type:"button", text:"破棄する", onclick:function(){
        restoreOffer = null; clearDraft(); render();
      }})
    ])]));
  }
  if(localOnly && route === "home"){
    kids.push(el("div", { "class":"wrap" }, [ el("div", { "class":"banner",
      text:"いまはこの端末のブラウザにだけ保存している。共有されたURLから開くと、同じ内容をふたりで見られる。" }) ]));
  }
  if(readOnly && route === "home"){
    kids.push(el("div", { "class":"wrap" }, [ el("div", { "class":"banner",
      text:"閲覧専用で開いている。書きかえられるのは、この引き継ぎ書を作った人だけ。" }) ]));
  }
  if(route === "home") kids.push(coverView());
  else if(route === "full") kids.push(fullView());
  else kids.push(sectionView(route.slice(4)));
  kids.push(el("div", { id:"savebar-host" }));
  root.replaceChildren.apply(root, kids);
  paintSaveBar();
}

/* ---------- 起動 ---------- */
function enterLocalOnly(){
  localOnly = true;
  var d = readDraft();
  if(d && JSON.stringify(d.data) !== JSON.stringify(published)){ state = d.data; restoreOffer = null; dirty = false; }
  render();
}
function boot(){
  var justSaved = false, wantRoute = null, wantScroll = 0;
  try {
    if(sessionStorage.getItem(LS + ".justSaved")){ justSaved = true; sessionStorage.removeItem(LS + ".justSaved"); }
    wantRoute = sessionStorage.getItem(LS + ".route");
    wantScroll = Number(sessionStorage.getItem(LS + ".scroll") || 0);
    sessionStorage.removeItem(LS + ".route");
    sessionStorage.removeItem(LS + ".scroll");
  } catch(e){}
  if(justSaved) clearDraft();
  var d = readDraft();
  if(d && JSON.stringify(d.data) !== JSON.stringify(published)) restoreOffer = d;
  if(wantRoute) route = wantRoute;
  render();
  if(justSaved) toast("保存した");
  if(wantScroll) setTimeout(function(){ window.scrollTo(0, wantScroll); }, 60);

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){ artifactNS = ns; if(!ns) enterLocalOnly(); }, function(){ enterLocalOnly(); });
    window.claude.use("downloads").then(function(ns){ downloadsNS = ns; }, function(){});
  } else enterLocalOnly();
}

window.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ if(askEl) closeAsk(); else closeSheet(); }
  if((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); if(dirty) save(); }
});
window.addEventListener("beforeunload", function(e){ if(dirty && !saving){ e.preventDefault(); e.returnValue = ""; } });

boot();
})();
</script>
