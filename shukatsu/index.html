<title>そのときのために</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="app-css">
:root{
  --ground:#EDF0EF; --surface:#FBFCFC; --surface2:#F2F6F5; --sunken:#E4EAE9;
  --line:#D8E1E1; --line-strong:#C2CFCF;
  --ink:#14262E; --ink2:#4C6169; --ink3:#7E9299;
  --accent:#0B6E78; --accent-press:#095A63; --accent-ink:#FFFFFF; --accent-soft:#DBECEC; --accent-line:#9CC8CB;
  --done:#4A8A6E; --caution:#96453F; --caution-soft:#F3E3E1;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(16,40,45,.05),0 8px 22px -14px rgba(16,40,45,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C1517; --surface:#141F22; --surface2:#1A272B; --sunken:#0F1B1E;
    --line:#25363A; --line-strong:#33484D;
    --ink:#E7EFEF; --ink2:#A3B7BA; --ink3:#7B9095;
    --accent:#4CBAC1; --accent-press:#6ACBD1; --accent-ink:#06232A; --accent-soft:#11333A; --accent-line:#2A5F66;
    --done:#6FBE93; --caution:#DB938E; --caution-soft:#33211F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0C1517; --surface:#141F22; --surface2:#1A272B; --sunken:#0F1B1E;
  --line:#25363A; --line-strong:#33484D;
  --ink:#E7EFEF; --ink2:#A3B7BA; --ink3:#7B9095;
  --accent:#4CBAC1; --accent-press:#6ACBD1; --accent-ink:#06232A; --accent-soft:#11333A; --accent-line:#2A5F66;
  --done:#6FBE93; --caution:#DB938E; --caution-soft:#33211F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.only-wide{display:none}
@media (min-width:860px){.only-wide{display:block}.only-narrow{display:none}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1060px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{flex:none;display:flex;gap:2px;align-items:flex-end;height:20px}
.mark i{display:block;width:2px;border-radius:1px;background:var(--accent)}
.mark i:nth-child(1){height:9px;opacity:.45}
.mark i:nth-child(2){height:16px;opacity:.7}
.mark i:nth-child(3){height:20px}
.mark i:nth-child(4){height:13px;opacity:.55}
.brand-name{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.spacer{flex:1}
.tb-pct{font-family:var(--mono);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress-line{height:2px;background:var(--sunken)}
.progress-line span{display:block;height:100%;background:var(--accent);transition:width .4s ease}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:var(--accent-line)}
.btn:active{transform:translateY(.5px)}
.btn-solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-solid:hover{background:var(--accent-press);border-color:var(--accent-press)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink2);padding:7px 10px}
.btn-quiet:hover{background:var(--surface2);border-color:transparent}
.btn-sm{padding:4px 11px;font-size:12.5px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ---------- cover ---------- */
.cover{padding:34px 0 10px}
@media (min-width:860px){.cover{display:grid;grid-template-columns:210px 1fr;gap:44px;align-items:start;padding-top:52px}}
.spine-box{display:flex;flex-direction:column;gap:12px}
.spine{display:flex;gap:5px;align-items:flex-end;height:96px;padding:10px 12px;background:var(--sunken);
  border-radius:var(--r);border:1px solid var(--line)}
.spine-bar{flex:1;height:100%;background:var(--surface);border-radius:2px;position:relative;overflow:hidden;
  border:0;padding:0;cursor:pointer;min-width:0}
.spine-bar b{position:absolute;left:0;right:0;bottom:0;background:var(--accent);display:block;border-radius:2px;
  transition:height .5s cubic-bezier(.2,.7,.3,1)}
.spine-bar:hover b{background:var(--accent-press)}
.spine-foot{display:flex;align-items:baseline;gap:9px}
.spine-pct{font-family:var(--mono);font-size:25px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.spine-cap{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.06em;line-height:1.5;white-space:pre-line}
.cover-eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;margin:0 0 10px}
.cover-title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7.4vw,46px);line-height:1.32;margin:0 0 14px;
  text-wrap:balance;letter-spacing:.01em}
.cover-lead{margin:0;color:var(--ink2);max-width:34em}
.cover-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;font-family:var(--mono);font-size:12px;color:var(--ink3);
  font-variant-numeric:tabular-nums}

/* ---------- cards / notices ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.intro{margin:26px 0 0;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow)}
.intro h2{font-family:var(--serif);font-size:16.5px;margin:0 0 8px;font-weight:700}
.intro p{margin:0;white-space:pre-wrap;color:var(--ink2)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--caution-soft);
  border:1px solid color-mix(in srgb,var(--caution) 30%,transparent);color:var(--ink);font-size:13.5px;line-height:1.7}
.notice b{color:var(--caution)}
.hint{padding:11px 14px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line);
  font-size:13.5px;color:var(--ink2);line-height:1.7}

/* ---------- section list ---------- */
.list-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.list-head h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:700}
.list-head span{font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.1em}
.search{width:100%;max-width:520px;margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px}
.search::placeholder{color:var(--ink3)}
.seclist{display:grid;gap:9px;padding:0 0 30px}
@media (min-width:700px){.seclist{grid-template-columns:1fr 1fr}}
.seccard{display:grid;grid-template-columns:auto 1fr auto;gap:3px 13px;align-items:center;width:100%;text-align:left;
  padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.seccard:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.seccard:active{transform:translateY(1px)}
.sec-idx{grid-column:1;grid-row:1/3;font-family:var(--mono);font-size:12px;color:var(--ink3);
  font-variant-numeric:tabular-nums;align-self:start;padding-top:5px}
.sec-name{grid-column:2;grid-row:1;font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.5}
.sec-lead{grid-column:2;grid-row:2;font-size:12.5px;color:var(--ink3);line-height:1.6}
.sec-meter{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  align-self:center}
.sec-pct{font-family:var(--mono);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-bar{width:44px;height:3px;background:var(--sunken);border-radius:2px;overflow:hidden}
.sec-bar b{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.sec-bar.full b{background:var(--done)}

/* ---------- section page ---------- */
.sec-head{padding:24px 0 6px;max-width:720px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-size:13.5px;
  padding:6px 0;cursor:pointer;font-family:var(--mono);letter-spacing:.04em}
.back:hover{color:var(--accent)}
.sec-title{font-family:var(--serif);font-weight:700;font-size:clamp(24px,5.4vw,31px);margin:6px 0 8px;line-height:1.4}
.sec-title small{font-family:var(--mono);font-size:13px;color:var(--ink3);font-weight:400;margin-right:12px;letter-spacing:.06em}
.sec-desc{margin:0 0 18px;color:var(--ink2);max-width:40em;font-size:14.5px}
.fields{display:flex;flex-direction:column;gap:2px;padding-bottom:120px;max-width:720px}
.field{padding:15px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.f-label{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--ink3);margin-bottom:6px}
.f-help{font-size:12.5px;color:var(--ink3);margin:0 0 8px;line-height:1.65}
.f-val{white-space:pre-wrap;word-break:break-word}
.f-empty{color:var(--ink3);font-size:14px}
.in{display:block;width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);font:inherit;font-size:15.5px;line-height:1.7}
.in:hover{border-color:var(--line-strong)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:66px;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--accent-line)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip-read{display:inline-block;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:500}

/* ---------- repeating rows ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.row-n{font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.08em}
.row-grid{display:grid;gap:9px}
@media (min-width:620px){.row-grid{grid-template-columns:1fr 1fr}.row-grid .span{grid-column:1/-1}}
.mini-label{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px;font-family:var(--mono);letter-spacing:.06em}
.row-read{display:grid;gap:2px 14px;grid-template-columns:auto 1fr;font-size:14.5px}
.row-read dt{font-family:var(--mono);font-size:11.5px;color:var(--ink3);padding-top:5px;white-space:nowrap}
.row-read dd{margin:0;white-space:pre-wrap;word-break:break-word}
.del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:12.5px;padding:4px 8px;border-radius:6px}
.del:hover{color:var(--caution);background:var(--caution-soft)}

/* ---------- tasks ---------- */
.tasks{display:flex;flex-direction:column;gap:1px}
.task{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.task:first-child{border-top:0}
.tick{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line-strong);margin-top:4px;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.task[aria-pressed="true"] .tick{background:var(--done);border-color:var(--done);color:#fff}
.task[aria-pressed="true"] .task-t{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.task-t{font-size:15px;line-height:1.65}

/* ---------- save bar / toast ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
.savebar-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:12px}
.savebar-t{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:70;background:var(--ink);color:var(--ground);
  padding:9px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 0;padding:11px 14px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid var(--accent-line);font-size:13.5px;color:var(--ink)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,22,26,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;
  border:1px solid var(--line);padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:14px}}
.sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 4px;font-weight:700}
.sheet-sub{margin:0 0 16px;color:var(--ink2);font-size:14px}
.menu{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:12px 8px;
  border-radius:8px;cursor:pointer;font-size:15px}
.menu button:hover{background:var(--surface2)}
.menu small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.5}
.steps{margin:0;padding-left:1.1em;color:var(--ink2);font-size:14px}
.steps li{margin-bottom:8px}

/* ---------- full text view ---------- */
.full{max-width:720px}
.full h2{font-family:var(--serif);font-size:20px;margin:30px 0 6px;padding-top:18px;border-top:2px solid var(--line);font-weight:700}
.full h2 small{font-family:var(--mono);font-size:12px;color:var(--ink3);font-weight:400;margin-right:10px}
.full .field{padding:9px 0}
@media print{
  .topbar,.savebar,.no-print{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  .full h2{page-break-after:avoid}
  .field{page-break-inside:avoid}
}
</style>
<div id="root"></div>

/* =======================================================================
   小さな道具
   ======================================================================= */
function el(tag, a, kids){
  var e = document.createElement(tag), k;
  if(a) for(k in a){
    if(!Object.prototype.hasOwnProperty.call(a,k)) continue;
    var v = a[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "text") e.textContent = v;
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  if(kids != null){
    (Array.isArray(kids) ? kids : [kids]).forEach(function(c){
      if(c == null || c === false) return;
      e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function isBlank(v){ return v == null || String(v).trim() === ""; }
function pad2(n){ return n < 10 ? "0" + n : String(n); }
function fmtDateTime(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.getFullYear() + "." + pad2(d.getMonth()+1) + "." + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function fmtDate(v){
  if(!v) return "";
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  return m ? (m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日") : v;
}

/* =======================================================================
   状態
   ======================================================================= */
function emptyState(){ return { v:1, owner:"", intro:"", updatedAt:"", d:{} }; }
function normalize(o){
  var s = emptyState();
  if(o && typeof o === "object"){
    if(typeof o.owner === "string") s.owner = o.owner;
    if(typeof o.intro === "string") s.intro = o.intro;
    if(typeof o.updatedAt === "string") s.updatedAt = o.updatedAt;
    if(o.d && typeof o.d === "object") s.d = o.d;
  }
  SCHEMA.forEach(function(sec){ if(!s.d[sec.id] || typeof s.d[sec.id] !== "object") s.d[sec.id] = {}; });
  return s;
}
function readEmbedded(){
  var n = document.getElementById("note-data");
  try { return normalize(JSON.parse(n.textContent)); } catch(e){ return emptyState(); }
}

/* --- 下書き（この端末） --- */
function writeDraft(){
  try { localStorage.setItem(LS + ".draft", JSON.stringify({ at: Date.now(), data: state })); } catch(e){}
}
function readDraft(){
  try {
    var raw = localStorage.getItem(LS + ".draft");
    if(!raw) return null;
    var o = JSON.parse(raw);
    return o && o.data ? { at: o.at || 0, data: normalize(o.data) } : null;
  } catch(e){ return null; }
}
function clearDraft(){ try { localStorage.removeItem(LS + ".draft"); } catch(e){} }

/* =======================================================================
   値の読み書き
   ======================================================================= */
function get(secId, key){ var s = state.d[secId]; return s ? s[key] : undefined; }
function set(secId, key, v){
  if(!state.d[secId]) state.d[secId] = {};
  state.d[secId][key] = v;
  markDirty();
}
function markDirty(){
  dirty = true;
  writeDraft();
  paintSaveBar();
  paintProgress();
}

/* =======================================================================
   進み具合
   ======================================================================= */
function rowHasContent(row){
  if(!row) return false;
  for(var k in row){ if(!isBlank(row[k])) return true; }
  return false;
}
function taskItems(sec, field){
  var custom = get(sec.id, field.k + "_custom");
  return field.items.concat(Array.isArray(custom) ? custom : []);
}
function sectionProgress(sec){
  var done = 0, total = 0;
  sec.f.forEach(function(f){
    if(f.t === "tasks"){
      var items = taskItems(sec, f);
      var checked = get(sec.id, f.k + "_done") || {};
      total += items.length;
      items.forEach(function(it){ if(checked[it]) done++; });
      return;
    }
    total += 1;
    var v = get(sec.id, f.k);
    if(f.t === "list"){ if(Array.isArray(v) && v.some(rowHasContent)) done++; }
    else if(!isBlank(v)) done++;
  });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}
function overallProgress(){
  var done = 0, total = 0;
  SCHEMA.forEach(function(sec){ var p = sectionProgress(sec); done += p.done; total += p.total; });
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}

/* =======================================================================
   公開する HTML を組み立てる
   （ページの正本は #app-css と #app-js。DOM は書き出さない）
   ======================================================================= */
function buildDoc(data){
  var css = document.getElementById("app-css").textContent;
  var js  = document.getElementById("app-js").textContent;
  var json = JSON.stringify(data).replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026");
  return [
    "<!doctype html>",
    '<html lang="ja">',
    "<head>",
    '<meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
    "<title>" + TITLE + "</title>",
    '<link rel="preconnect" href="https://fonts.googleapis.com">',
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
    '<link rel="stylesheet" href="' + FONT_URL + '">',
    '<style id="app-css">' + css + "</style>",
    "</head>",
    "<body>",
    '<div id="root"></div>',
    '<script type="application/json" id="note-data">' + json + "<\/script>",
    '<script id="app-js">' + js + "<\/script>",
    "</body>",
    "</html>"
  ].join("\n");
}

/* =======================================================================
   保存
   ======================================================================= */
function save(){
  if(saving) return;
  state.updatedAt = new Date().toISOString();
  writeDraft();
  if(!artifactNS || localOnly){
    dirty = false; paintSaveBar();
    toast(localOnly ? "この端末に保存しました" : "保存しました");
    return;
  }
  saving = true; paintSaveBar();
  try {
    sessionStorage.setItem(LS + ".justSaved", "1");
    sessionStorage.setItem(LS + ".route", route);
    sessionStorage.setItem(LS + ".scroll", String(window.scrollY || 0));
  } catch(e){}
  artifactNS.publish(buildDoc(state)).catch(function(err){
    try { sessionStorage.removeItem(LS + ".justSaved"); } catch(e){}
    saving = false; paintSaveBar();
    var code = err && err.code;
    if(code === "conflict"){
      toast("ほかの端末で先に保存されました。最新の内容を読み込みます。");
    } else if(code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared"){
      readOnly = true; mode = "read"; render();
      toast("このノートは閲覧専用です。書き込めるのは作成した人だけです。");
    } else if(code === "too_large"){
      toast("内容が大きすぎて保存できませんでした。長い文章を少し減らしてください。");
    } else if(code === "rate_limited"){
      toast("保存の間隔が短すぎます。少し待ってからもう一度お試しください。");
    } else {
      toast("保存できませんでした。書いた内容はこの端末に残してあります。");
    }
  });
}

var root = document.getElementById("root");
var toastTimer = null;

function toast(msg){
  var old = document.querySelector(".toast");
  if(old) old.remove();
  var t = el("div", { "class":"toast", role:"status", text: msg });
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ if(t.parentNode) t.remove(); }, 3600);
}

function go(r){
  route = r; query = "";
  render();
  window.scrollTo(0, 0);
}

function autogrow(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }

function editable(){ return mode === "edit" && !readOnly; }

/* ---------- 上部バー ---------- */

/* ---------- 章のカード ---------- */
function sectionCards(){
  var q = query.trim().toLowerCase();
  var list = SCHEMA.map(function(sec, i){ return { sec: sec, i: i }; });
  if(q){
    list = list.filter(function(x){
      if((x.sec.n + " " + x.sec.lead + " " + x.sec.desc).toLowerCase().indexOf(q) >= 0) return true;
      if(x.sec.f.some(function(f){ return (f.l || "").toLowerCase().indexOf(q) >= 0; })) return true;
      return JSON.stringify(state.d[x.sec.id] || {}).toLowerCase().indexOf(q) >= 0;
    });
  }
  if(!list.length) return [ el("p", { "class":"f-empty", text:"見つかりませんでした。" }) ];
  return list.map(function(x){
    var p = sectionProgress(x.sec);
    return el("button", { "class":"seccard", onclick:function(){ go("sec:" + x.sec.id); } }, [
      el("span", { "class":"sec-idx", text: pad2(x.i + 1) }),
      el("span", { "class":"sec-name", text: x.sec.n }),
      el("span", { "class":"sec-meter" }, [
        el("span", { "class":"sec-pct", text: p.pct + "%" }),
        el("span", { "class":"sec-bar" + (p.pct === 100 ? " full" : "") }, [ el("b", { style:"width:" + p.pct + "%" }) ])
      ]),

    ]);
  });
}

/* ---------- ひとつの項目 ---------- */
function textInput(f, value, onchange, ph){
  if(f.t === "long"){
    var ta = el("textarea", { "class":"in", rows:"2", placeholder: ph || f.ph || "",
      oninput:function(e){ onchange(e.target.value); autogrow(e.target); } }, value || "");
    setTimeout(function(){ autogrow(ta); }, 0);
    return ta;
  }
  return el("input", { "class":"in", type: f.t === "date" ? "date" : "text", value: value || "",
    placeholder: ph || f.ph || "", oninput:function(e){ onchange(e.target.value); } });
}
function choiceInput(f, value, onchange){
  var box = el("div", { "class":"chips" });
  f.o.forEach(function(opt){
    var b = el("button", { "class":"chip", type:"button", "aria-pressed": String(value === opt), text: opt,
      onclick:function(){
        var next = (value === opt) ? "" : opt;
        value = next; onchange(next);
        Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed", String(c.textContent === next)); });
      }});
    box.appendChild(b);
  });
  return box;
}
function readValue(f, v){
  if(isBlank(v)) return el("p", { "class":"f-empty", text:"—" });
  if(f.t === "choice") return el("span", { "class":"chip-read", text: v });
  if(f.t === "date") return el("p", { "class":"f-val", text: fmtDate(v) });
  return el("p", { "class":"f-val", text: v });
}

function plainField(sec, f){
  var wrap = el("div", { "class":"field" }, [ el("span", { "class":"f-label", text: f.l }) ]);
  if(f.h && editable()) wrap.appendChild(el("p", { "class":"f-help", text: f.h }));
  if(editable()){
    if(f.t === "choice") wrap.appendChild(choiceInput(f, get(sec.id, f.k) || "", function(v){ set(sec.id, f.k, v); }));
    else wrap.appendChild(textInput(f, get(sec.id, f.k), function(v){ set(sec.id, f.k, v); }));
  } else {
    wrap.appendChild(readValue(f, get(sec.id, f.k)));
  }
  return wrap;
}

/* ---------- くり返しの項目 ---------- */
function listField(sec, f){
  var wrap = el("div", { "class":"field" }, [ el("span", { "class":"f-label", text: f.l }) ]);
  if(f.h && editable()) wrap.appendChild(el("p", { "class":"f-help", text: f.h }));
  var host = el("div", { "class":"rows" });
  wrap.appendChild(host);

  function rows(){ var v = get(sec.id, f.k); return Array.isArray(v) ? v : []; }
  function paint(){
    var list = rows();
    var kids = [];
    if(editable()){
      list.forEach(function(row, i){
        var grid = el("div", { "class":"row-grid" });
        f.c.forEach(function(col){
          var cell = el("div", { "class": col.span ? "span" : "" }, [ el("span", { "class":"mini-label", text: col.l }) ]);
          if(col.t === "choice"){
            cell.appendChild(choiceInput(col, row[col.k] || "", function(v){ row[col.k] = v; markDirty(); }));
          } else {
            cell.appendChild(textInput(col, row[col.k], function(v){ row[col.k] = v; markDirty(); }, col.ph));
          }
          grid.appendChild(cell);
        });
        kids.push(el("div", { "class":"row" }, [
          el("div", { "class":"row-top" }, [
            el("span", { "class":"row-n", text: pad2(i + 1) }),
            el("span", { "class":"spacer" }),
            el("button", { "class":"del", type:"button", text:"削除", onclick:function(){
              if(rowHasContent(row) && !window.confirm("この行を削除します。よろしいですか？")) return;
              list.splice(i, 1); set(sec.id, f.k, list); paint();
            }})
          ]),
          grid
        ]));
      });
      kids.push(el("button", { "class":"btn btn-sm", type:"button", text:"＋ " + (f.addLabel || "追加"),
        onclick:function(){ var l = rows().slice(); l.push({}); set(sec.id, f.k, l); paint(); } }));
    } else {
      var filled = list.filter(rowHasContent);
      if(!filled.length){ kids.push(el("p", { "class":"f-empty", text:"—" })); }
      else filled.forEach(function(row){
        var dl = el("dl", { "class":"row-read" });
        f.c.forEach(function(col){
          if(isBlank(row[col.k])) return;
          dl.appendChild(el("dt", { text: col.l }));
          dl.appendChild(el("dd", { text: row[col.k] }));
        });
        kids.push(el("div", { "class":"row" }, [dl]));
      });
    }
    host.replaceChildren.apply(host, kids);
  }
  paint();
  return wrap;
}

/* ---------- やることリスト ---------- */
function tasksField(sec, f){
  var wrap = el("div", { "class":"field" }, [ el("span", { "class":"f-label", text: f.l }) ]);
  var host = el("div", { "class":"tasks" });
  wrap.appendChild(host);
  function checked(){ var c = get(sec.id, f.k + "_done"); return (c && typeof c === "object") ? c : {}; }
  function custom(){ var c = get(sec.id, f.k + "_custom"); return Array.isArray(c) ? c : []; }
  function paint(){
    var done = checked(), items = f.items.concat(custom());
    var kids = items.map(function(it, i){
      var isCustom = i >= f.items.length;
      return el("button", { "class":"task", type:"button", "aria-pressed": String(!!done[it]),
        onclick:function(){
          var d = Object.assign({}, checked());
          if(d[it]) delete d[it]; else d[it] = true;
          set(sec.id, f.k + "_done", d); paint();
        }}, [
        el("span", { "class":"tick", text:"✓" }),
        el("span", { "class":"task-t", text: it }),
        (isCustom && editable()) ? el("span", { "class":"spacer" }) : null,
        (isCustom && editable()) ? el("span", { "class":"del", text:"削除", onclick:function(ev){
          ev.stopPropagation();
          var c = custom().filter(function(x){ return x !== it; });
          set(sec.id, f.k + "_custom", c); paint();
        }}) : null
      ]);
    });
    if(editable()){
      var input = el("input", { "class":"in", type:"text", placeholder:"自分のやることを足す（Enterで追加）",
        onkeydown:function(e){
          if(e.key !== "Enter") return;
          var v = e.target.value.trim();
          if(!v) return;
          var c = custom().slice(); c.push(v);
          set(sec.id, f.k + "_custom", c); e.target.value = ""; paint();
        }});
      kids.push(el("div", { style:"padding-top:14px" }, [input]));
    }
    host.replaceChildren.apply(host, kids);
  }
  paint();
  return wrap;
}

function fieldNode(sec, f){
  if(f.t === "list") return listField(sec, f);
  if(f.t === "tasks") return tasksField(sec, f);
  return plainField(sec, f);
}

  ]));
  wrap.appendChild(el("h2", { style:"border-top:0;margin-top:10px" }, [ el("small", { text:"00" }), state.owner ? state.owner + "のノート" : "そのときのために" ]));

  SCHEMA.forEach(function(sec, i){
    var body = [];
    sec.f.forEach(function(f){
      var v = get(sec.id, f.k);

        var items = taskItems(sec, f).filter(function(it){ return !done[it]; });
        if(items.length) body.push(el("div", { "class":"field" }, [ el("span", { "class":"f-label", text:"まだ終わっていないこと" }),

        return;
      }
      if(f.t === "list"){

        }).join("\n\n");
        body.push(el("div", { "class":"field" }, [ el("span", { "class":"f-label", text: f.l }), el("p", { "class":"f-val", text: lines }) ]));

    wrap.appendChild(el("h2", {}, [ el("small", { text: pad2(i + 1) }), sec.n ]));
    body.forEach(function(b){ wrap.appendChild(b); });

}

    ]),
    el("div", { "class":"hint", style:"margin-top:12px",
      text:"バックアップは「メニュー → バックアップを保存する」から JSON ファイルで書き出せます。年に一度、内容を見直して書き出しておくと安心です。" })
  ]));
}

/* ---------- 書き出し・読み込み ---------- */
function doExport(){
  var json = JSON.stringify(state, null, 2);
  var d = new Date();
  var name = "endingnote-" + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + ".json";
  if(downloadsNS){
    downloadsNS.save({ filename: name, data: json }).then(function(){
      closeSheet(); toast("バックアップを保存しました");
    }).catch(function(err){
      var c = err && err.code;
      if(c === "declined") return;
      showJson(json);
    });
  } else {
    showJson(json);
  }
}
function showJson(json){
  sheet("バックアップ", "この文字列をすべて選んでコピーし、メモアプリなどに貼って保存してください。",
    el("textarea", { "class":"in", rows:"10", readonly:"", onclick:function(e){ e.target.select(); } }, json));
}
function doImport(){
  var input = el("input", { type:"file", accept:"application/json,.json", style:"display:none" });
  input.addEventListener("change", function(){
    var file = input.files && input.files[0];
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var parsed = normalize(JSON.parse(String(r.result)));
        if(!window.confirm("いま表示している内容を、読み込んだ内容で置きかえます。よろしいですか？")) return;
        state = parsed;
        markDirty(); closeSheet(); go("home");
        toast("読み込みました。内容を確かめて「保存する」を押してください。");
      } catch(e){
        toast("読み込めませんでした。バックアップのファイルか確かめてください。");
      }
    };
    r.readAsText(file);
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(function(){ input.remove(); }, 0);
}

/* ---------- 保存バー ---------- */
function paintSaveBar(){
  var host = document.getElementById("savebar-host");
  if(!host) return;
  if(!dirty && !saving){ host.replaceChildren(); return; }
  host.replaceChildren(el("div", { "class":"savebar" }, [
    el("div", { "class":"savebar-in" }, [
      el("span", { "class":"savebar-t", text: saving ? "保存しています…" : "保存していない変更があります" }),
      (!localOnly && !saving) ? el("button", { "class":"btn btn-sm", type:"button", text:"元にもどす", onclick:function(){
        if(!window.confirm("最後に保存したときの内容にもどします。書きかけの内容は消えます。")) return;
        state = clone(published); clearDraft(); dirty = false; render(); toast("もとにもどしました");
      }}) : null,
      el("button", { "class":"btn btn-solid btn-sm", type:"button", text: saving ? "保存中" : "保存する",
        disabled: saving ? "" : null, onclick: save })
    ])
  ]));
}

/* ---------- 描画 ---------- */
function render(){
  var kids = topbar();
  if(restoreOffer){
    kids.push(el("div", { "class":"wrap" }, [
      el("div", { "class":"banner" }, [
        el("span", { style:"flex:1;min-width:180px", text:"この端末に、保存していない変更が残っています。" }),
        el("button", { "class":"btn btn-sm", type:"button", text:"反映する", onclick:function(){
          state = restoreOffer.data; restoreOffer = null; dirty = true; render(); paintSaveBar();
          toast("下書きを反映しました。内容を確かめて「保存する」を押してください。");
        }}),
        el("button", { "class":"btn btn-quiet btn-sm", type:"button", text:"破棄する", onclick:function(){
          restoreOffer = null; clearDraft(); render();
        }})
      ])
    ]));
  }
  if(localOnly && route === "home"){
    kids.push(el("div", { "class":"wrap" }, [
      el("div", { "class":"banner", text:"いまはこの端末のブラウザにだけ保存されています。共有された URL から開くと、みんなで同じ内容を見られます。" })
    ]));
  }
  if(readOnly && route === "home"){
    kids.push(el("div", { "class":"wrap" }, [
      el("div", { "class":"banner", text:"閲覧専用で開いています。内容を書きかえられるのは、このノートを作った人だけです。" })
    ]));
  }
  if(route === "home") kids.push(homeView());
  else if(route === "full") kids.push(fullView());
  else kids.push(sectionView(route.slice(4)));
  kids.push(el("div", { id:"savebar-host" }));
  root.replaceChildren.apply(root, kids);
  paintSaveBar();
}

/* ---------- 起動 ---------- */
function enterLocalOnly(){
  localOnly = true;
  var d = readDraft();
  if(d && JSON.stringify(d.data) !== JSON.stringify(published)){
    state = d.data; restoreOffer = null; dirty = false;
  }
  render();
}
function boot(){
  var justSaved = false, wantRoute = null, wantScroll = 0;
  try {
    if(sessionStorage.getItem(LS + ".justSaved")){ justSaved = true; sessionStorage.removeItem(LS + ".justSaved"); }
    wantRoute = sessionStorage.getItem(LS + ".route");
    wantScroll = Number(sessionStorage.getItem(LS + ".scroll") || 0);
    sessionStorage.removeItem(LS + ".route");
    sessionStorage.removeItem(LS + ".scroll");
  } catch(e){}
  if(justSaved) clearDraft();
  var d = readDraft();
  if(d && JSON.stringify(d.data) !== JSON.stringify(published)) restoreOffer = d;
  if(wantRoute) route = wantRoute;
  render();
  if(justSaved) toast("保存しました");
  if(wantScroll) setTimeout(function(){ window.scrollTo(0, wantScroll); }, 60);

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      artifactNS = ns;
      if(!ns) enterLocalOnly();
    }, function(){ enterLocalOnly(); });
    window.claude.use("downloads").then(function(ns){ downloadsNS = ns; }, function(){});
  } else {
    enterLocalOnly();
  }
}

window.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeSheet();
  if((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); if(dirty) save(); }
});
window.addEventListener("beforeunload", function(e){
  if(dirty && !saving){ e.preventDefault(); e.returnValue = ""; }
});

boot();
})();
</script>
