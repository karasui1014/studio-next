<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふたりの家計</title>
<meta name="theme-color" content="#2E5F63">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style id="app-css">
:root{
  --paper:#F5F1E8; --surface:#FFFDF7; --surface2:#F0EADC; --sunken:#E7DFCE;
  --line:#E2D9C7; --line-strong:#CDC1A9;
  --ink:#3E4540; --ink2:#6E6C5E; --ink3:#9C947F;
  --accent:#4C888C; --accent-press:#3E7376; --accent-ink:#FFFFFF; --accent-soft:#DDEBE9; --accent-line:#9FC6C6;
  --tan:#D9B98C; --tan-soft:#F0E2CC; --brown:#8A7A67;
  --done:#6E9B7A; --caution:#A0564A; --caution-soft:#F6E5DF;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
  --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(62,69,64,.05),0 10px 26px -16px rgba(62,69,64,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1D1B; --surface:#232724; --surface2:#2A2F2B; --sunken:#151817;
    --line:#363B37; --line-strong:#4A514B;
    --ink:#EDE7DA; --ink2:#B5AF9F; --ink3:#8B8677;
    --accent:#7FC4C6; --accent-press:#9AD4D5; --accent-ink:#122B2C; --accent-soft:#1D3536; --accent-line:#3D6465;
    --tan:#C9A97C; --tan-soft:#3A322A; --brown:#A08D77;
    --done:#8CBE99; --caution:#D69084; --caution-soft:#33221F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#1A1D1B; --surface:#232724; --surface2:#2A2F2B; --sunken:#151817;
  --line:#363B37; --line-strong:#4A514B;
  --ink:#EDE7DA; --ink2:#B5AF9F; --ink3:#8B8677;
  --accent:#7FC4C6; --accent-press:#9AD4D5; --accent-ink:#122B2C; --accent-soft:#1D3536; --accent-line:#3D6465;
  --tan:#C9A97C; --tan-soft:#3A322A; --brown:#A08D77;
  --done:#8CBE99; --caution:#D69084; --caution-soft:#33221F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.85);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.spacer{flex:1}

/* ---------- 上部 ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:960px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.brand-name{font-family:var(--serif);font-weight:700;font-size:15.5px;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-when{font-family:var(--mono);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
@media (max-width:520px){.tb-when{display:none}}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface2);border-color:var(--accent-line)}
.btn:active{transform:translateY(1px)}
.btn-solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-solid:hover{background:var(--accent-press);border-color:var(--accent-press)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink2);padding:8px 11px}
.btn-quiet:hover{background:var(--surface2)}
.btn-sm{padding:5px 13px;font-size:13px}
.btn-lg{padding:13px 24px;font-size:15.5px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- 案内役 ---------- */
.akari{flex:none;display:block;width:auto}
.speech{display:flex;gap:13px;align-items:flex-start;margin:20px 0 0}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 16px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;background:var(--surface);
  border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 3px}
.bubble p{margin:0;font-size:14.5px;line-height:1.75}

/* ---------- 大きな数字 ---------- */
.head{padding:26px 0 4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--brown);margin:0 0 8px}
.net{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.net-num{font-family:var(--mono);font-size:clamp(34px,10vw,58px);line-height:1.05;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.net-num small{font-family:var(--sans);font-size:.34em;letter-spacing:0;margin-left:4px;color:var(--ink2)}
.net-num.minus{color:var(--caution)}
.delta{font-family:var(--mono);font-size:13px;padding:3px 11px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);margin-bottom:9px;font-variant-numeric:tabular-nums}
.delta.up{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.delta.down{background:var(--caution-soft);border-color:color-mix(in srgb,var(--caution) 30%,transparent);color:var(--caution)}

/* ---------- カード ---------- */
.cards{display:grid;gap:11px;margin:22px 0 0;grid-template-columns:1fr 1fr}
@media (min-width:760px){.cards{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.card-t{font-size:12.5px;color:var(--ink3);margin:0 0 3px;letter-spacing:.03em}
.card-n{font-family:var(--mono);font-size:clamp(19px,5vw,24px);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.3}
.card-n small{font-family:var(--sans);font-size:12px;color:var(--ink3);margin-left:3px;letter-spacing:0}
.card-s{font-size:12px;color:var(--ink3);margin:4px 0 0;line-height:1.55}
.card.debt .card-n{color:var(--caution)}
.card.good .card-n{color:var(--done)}

/* ---------- 区切り ---------- */
.block{margin:38px 0 0}
.block-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.block-head h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:700}
.block-head span{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.12em}

/* ---------- ローン・積立の行 ---------- */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  box-shadow:var(--shadow);margin-bottom:11px}
.item-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.item-name{font-family:var(--serif);font-weight:700;font-size:16.5px}
.item-num{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;margin-left:auto}
.bar{height:9px;border-radius:5px;background:var(--sunken);overflow:hidden}
.bar b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--tan),var(--accent));
  transition:width .6s ease}
.bar.debt b{background:linear-gradient(90deg,var(--accent),var(--tan))}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:12px 0 0;font-size:13.5px}
.facts dt{font-size:12px;color:var(--ink3);padding-top:4px;white-space:nowrap}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.facts dd b{font-family:var(--mono);font-weight:500}
.warn{margin:10px 0 0;padding:9px 12px;border-radius:9px;background:var(--caution-soft);
  border:1px solid color-mix(in srgb,var(--caution) 28%,transparent);font-size:12.5px;line-height:1.65}

/* ---------- グラフ ---------- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 10px;box-shadow:var(--shadow)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 4px 4px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.g-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.g-grid{stroke:var(--line);stroke-width:1}
.g-lab{font-family:var(--mono);font-size:10px;fill:var(--ink3)}

/* ---------- 入力 ---------- */
.form{max-width:680px;padding-bottom:140px}
.field{padding:15px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.f-label{display:block;font-size:14px;font-weight:500;margin-bottom:5px}
.f-help{font-size:12.5px;color:var(--ink3);margin:0 0 8px;line-height:1.65}
.in{display:block;width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:16px;line-height:1.7}
.in:hover{border-color:var(--accent-line)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.money{display:flex;align-items:center;gap:8px}
.money .in{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.money span{flex:none;font-size:13.5px;color:var(--ink2)}
.row{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.row-n{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.grid2{display:grid;gap:10px}
@media (min-width:620px){.grid2{grid-template-columns:1fr 1fr}.grid2 .span{grid-column:1/-1}}
.mini-label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
.del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:12.5px;padding:5px 9px;border-radius:7px}
.del:hover{color:var(--caution);background:var(--caution-soft)}

/* ---------- 鍵の画面 ---------- */
.lockwrap{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px 18px}
.lockcard{width:100%;max-width:400px;text-align:center;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px 24px 26px;box-shadow:var(--shadow)}
.lockcard .akari{margin:0 auto 6px}
.lock-t{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 8px;line-height:1.45}
.lock-s{font-size:13.5px;color:var(--ink2);margin:0 0 18px;line-height:1.75;text-align:left}
.lock-hint{font-size:13px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;margin:0 0 14px;text-align:left}
.lockcard .in{margin-bottom:10px;text-align:center;font-size:17px;letter-spacing:.08em}
.lockcard .in[type="text"]{text-align:left;letter-spacing:0;font-size:14.5px}
.lock-agree{display:flex;gap:9px;align-items:flex-start;text-align:left;font-size:12.5px;color:var(--ink2);
  line-height:1.7;margin:6px 0 12px;cursor:pointer}
.lock-agree input{margin-top:4px;flex:none;width:17px;height:17px;accent-color:var(--accent)}
.lockerr{margin:0 0 12px;padding:9px 12px;border-radius:9px;background:var(--caution-soft);
  border:1px solid color-mix(in srgb,var(--caution) 30%,transparent);font-size:13px;color:var(--ink)}
.lockcard .btn-lg{width:100%;justify-content:center}
.lock-note{font-size:12px;color:var(--ink3);line-height:1.7;margin:16px 0 0;text-align:left}

/* ---------- 保存バー・トースト・シート ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
  padding:11px 18px calc(11px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
.savebar-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:11px}
.savebar-t{font-size:13px;color:var(--ink2);flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:70;background:var(--ink);color:var(--paper);
  padding:10px 19px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(30,34,31,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;
  border:1px solid var(--line);padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h2{font-family:var(--serif);font-size:19px;margin:0 0 4px;font-weight:700}
.sheet-sub{margin:0 0 16px;color:var(--ink2);font-size:14px}
.menu{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.menu button{display:flex;flex-direction:column;width:100%;text-align:left;border:0;background:none;padding:13px 9px;
  border-radius:9px;cursor:pointer;font-size:15px}
.menu button:hover{background:var(--surface2)}
.menu small{display:block;color:var(--ink3);font-size:12.5px;line-height:1.5}
.steps{margin:0;padding-left:1.1em;color:var(--ink2);font-size:14px}
.steps li{margin-bottom:8px}
.empty{padding:26px 18px;text-align:center;color:var(--ink3);font-size:14px;background:var(--surface2);
  border:1px dashed var(--line-strong);border-radius:var(--r)}
</style>
<div id="root"></div>
<script type="application/json" id="note-data">{"v":1}</script>

/* =======================================================================
   小さな道具
   ======================================================================= */
function el(tag, a, kids){
  var e = document.createElement(tag), k;
  if(a) for(k in a){
    if(!Object.prototype.hasOwnProperty.call(a,k)) continue;
    var v = a[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "text") e.textContent = v;
    else if(k === "svg"){
      /* innerHTML はコード内で組み立てた <svg>/<img> だけ。利用者の文字列は通さない。 */
      if(typeof v !== "string" || !/^\s*<(svg|img)[\s>]/i.test(v)) throw new Error("unsafe markup");
      e.innerHTML = v;
    }
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  if(kids != null){
    (Array.isArray(kids) ? kids : [kids]).forEach(function(c){
      if(c == null || c === false) return;
      e.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function akari(size, mood){
  var src = ART[mood] || ART.normal || "";
  if(!src) return null;
  return '<img class="akari" src="' + src + '" alt="" style="height:' + (size || 76) + 'px">';
}
function speech(line, mood, size){
  var img = akari(size || 62, mood);
  return el("div", { "class":"speech" }, [
    img ? el("span", { svg: img }) : null,
    el("div", { "class":"bubble" }, [ el("p", { text: line }) ])
  ]);
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return n < 10 ? "0" + n : String(n); }
function fmtDateTime(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.getFullYear() + "." + pad2(d.getMonth()+1) + "." + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
/* 万円。小数第1位まで。3桁ごとにカンマ。 */
function man(v){
  var n = Number(v) || 0;
  var neg = n < 0; n = Math.abs(n);
  var s = (Math.round(n * 10) / 10).toFixed(Math.abs(n % 1) > 0.049 ? 1 : 0);
  s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "−" : "") + s;
}
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function ymNow(){ var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth()+1); }
/* いまから n か月後の「YYYY年M月」 */
function ymPlus(months){
  var d = new Date();
  var t = d.getFullYear() * 12 + d.getMonth() + Math.ceil(months);
  return Math.floor(t / 12) + "年" + (t % 12 + 1) + "月";
}
function uid(){ return Math.random().toString(36).slice(2, 9); }

/* =======================================================================
   数字の計算
   ======================================================================= */
/* 残高 B・毎月返済額 P・年利 r(%) から、完済までの月数と利息を出す。
   毎月の利息（B × 月利）より返済額が小さいと、いつまでも減らない。 */
function payoff(balance, monthly, rate){
  var B = num(balance), P = num(monthly), i = num(rate) / 100 / 12;
  if(B <= 0) return { months: 0, interest: 0, ok: true, done: true };
  if(P <= 0) return { months: 0, interest: 0, ok: false, why: "毎月の返済額が入っていない" };
  if(i <= 0){
    var m0 = B / P;
    return { months: m0, interest: 0, ok: true };
  }
  if(P <= B * i) return { months: 0, interest: 0, ok: false, why: "毎月の返済額が利息より小さいので、この条件では減らない" };
  var m = -Math.log(1 - (B * i) / P) / Math.log(1 + i);
  return { months: m, interest: P * m - B, ok: true };
}
function yearsText(months){
  var m = Math.ceil(months);
  var y = Math.floor(m / 12), r = m % 12;
  if(m <= 0) return "完済ずみ";
  if(y === 0) return "あと" + r + "か月";
  return "あと" + y + "年" + (r ? r + "か月" : "");
}

/* =======================================================================
   状態
   ======================================================================= */
function emptyState(){
  return { v:1, updatedAt:"", note:"",
    savings: 0, income: 0, expense: 0,
    loans: [], funds: [], history: [] };
}
var MAXROWS = 40, MAXHIST = 240;
function safeKey(k){ return k !== "__proto__" && k !== "constructor" && k !== "prototype"; }
function str(v, max){
  if(typeof v === "number") v = String(v);
  if(typeof v !== "string") return "";
  return v.length > max ? v.slice(0, max) : v;
}
/* 取り込んだJSONは、知っている形だけを残して作り直す。 */
function normalize(o){
  var s = emptyState();
  if(!o || typeof o !== "object") return s;
  s.updatedAt = str(o.updatedAt, 40);
  s.note = str(o.note, 2000);
  s.savings = num(o.savings);
  s.income = num(o.income);
  s.expense = num(o.expense);
  if(Array.isArray(o.loans)) s.loans = o.loans.slice(0, MAXROWS).map(function(r){
    r = (r && typeof r === "object") ? r : {};
    return { id: str(r.id, 12) || uid(), name: str(r.name, 60), balance: num(r.balance),
             monthly: num(r.monthly), rate: num(r.rate), origin: num(r.origin) };
  });
  if(Array.isArray(o.funds)) s.funds = o.funds.slice(0, MAXROWS).map(function(r){
    r = (r && typeof r === "object") ? r : {};
    return { id: str(r.id, 12) || uid(), name: str(r.name, 60), goal: num(r.goal),
             current: num(r.current), monthly: num(r.monthly) };
  });
  if(Array.isArray(o.history)) s.history = o.history.slice(-MAXHIST).map(function(h){
    h = (h && typeof h === "object") ? h : {};
    return { ym: /^\d{4}-\d{2}$/.test(h.ym) ? h.ym : "", savings: num(h.savings),
             funds: num(h.funds), debt: num(h.debt) };
  }).filter(function(h){ return !!h.ym && safeKey(h.ym); });
  return s;
}
function totalFunds(s){ return (s.funds || []).reduce(function(a, f){ return a + num(f.current); }, 0); }
function totalDebt(s){ return (s.loans || []).reduce(function(a, l){ return a + num(l.balance); }, 0); }
function totalAssets(s){ return num(s.savings) + totalFunds(s); }
function netWorth(s){ return totalAssets(s) - totalDebt(s); }

/* 保存のたびに、その月の記録を1点だけ残す（同じ月は上書き）。 */
function stampHistory(s){
  var ym = ymNow();
  var row = { ym: ym, savings: num(s.savings), funds: totalFunds(s), debt: totalDebt(s) };
  var h = (s.history || []).filter(function(x){ return x.ym !== ym; });
  h.push(row);
  h.sort(function(a, b){ return a.ym < b.ym ? -1 : 1; });
  s.history = h.slice(-MAXHIST);
}

/* =======================================================================
   鍵（暗証番号で中身そのものを暗号化する）
   ======================================================================= */
var IDLE_MS = 60 * 60 * 1000;
var PBKDF2_ITER = 250000;
var cryptoKey = null, currentSalt = "";
var locked = true, lockMode = "unlock", lockBusy = false, lockErr = "";
var lastAct = Date.now(), idleTimer = null;

function hasCrypto(){
  return !!(window.crypto && window.crypto.subtle && typeof window.crypto.subtle.deriveKey === "function");
}
function b64(bytes){
  var s = "", a = new Uint8Array(bytes);
  for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
  return btoa(s);
}
function unb64(t){
  var raw = atob(t), a = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
  return a;
}
function deriveKey(pass, salt, iter){
  return window.crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(function(base){
      return window.crypto.subtle.deriveKey(
        { name:"PBKDF2", salt: salt, iterations: iter, hash:"SHA-256" },
        base, { name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]);
    });
}
function seal(obj){
  var iv = window.crypto.getRandomValues(new Uint8Array(12));
  return window.crypto.subtle.encrypt({ name:"AES-GCM", iv: iv }, cryptoKey,
      new TextEncoder().encode(JSON.stringify(obj)))
    .then(function(ct){
      return { v:1, iter: PBKDF2_ITER, salt: currentSalt, iv: b64(iv), ct: b64(ct), at: Date.now() };
    });
}
function unseal(vault, key){
  return window.crypto.subtle.decrypt({ name:"AES-GCM", iv: unb64(vault.iv) }, key, unb64(vault.ct))
    .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}
function isVault(o){ return !!(o && typeof o === "object" && o.ct && o.salt && o.iv); }
function embeddedVault(){ return isVault(embedded) ? embedded : (embedded && isVault(embedded.vault) ? embedded.vault : null); }
function localVault(){
  try { var raw = localStorage.getItem(VKEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function writeLocalVault(v){ try { localStorage.setItem(VKEY, JSON.stringify(v)); } catch(e){} }
function readHint(){ try { return localStorage.getItem(HKEY) || ""; } catch(e){ return ""; } }
function writeHint(t){ try { t ? localStorage.setItem(HKEY, t) : localStorage.removeItem(HKEY); } catch(e){} }

function persistKey(key){
  if(!key) return Promise.resolve();
  return window.crypto.subtle.exportKey("raw", key).then(function(raw){
    try { sessionStorage.setItem(SKEY, JSON.stringify({ k: b64(raw), until: Date.now() + IDLE_MS, salt: currentSalt })); } catch(e){}
  }, function(){});
}
function restoreKey(){
  var o;
  try { o = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch(e){ o = null; }
  if(!o || !o.k || !o.until || Date.now() > o.until){ dropKey(); return Promise.resolve(null); }
  currentSalt = o.salt || "";
  return window.crypto.subtle.importKey("raw", unb64(o.k), { name:"AES-GCM" }, true, ["encrypt","decrypt"])
    .then(function(k){ return k; }, function(){ return null; });
}
function dropKey(){ try { sessionStorage.removeItem(SKEY); } catch(e){} }

function buildDoc(data){
  var css = document.getElementById("app-css").textContent;
  var js  = document.getElementById("app-js").textContent;
  var json = JSON.stringify(data).replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026");
  return [
    "<!doctype html>", '<html lang="ja">', "<head>", '<meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
    "<title>" + TITLE + "</title>",
    FAVICON ? '<link rel="icon" href="' + FAVICON + '">' : "",
    '<link rel="preconnect" href="https://fonts.googleapis.com">',
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
    /* フォントを待って画面が白いままにならないようにする */
    '<link rel="stylesheet" media="print" onload="this.media=\'all\'" href="' + FONT_URL + '">',
    '<style id="app-css">' + css + "</style>", "</head>", "<body>", '<div id="root"></div>',
    '<script type="application/json" id="note-data">' + json + "<\/script>",
    '<script id="app-js">' + js + "<\/script>", "</body>", "</html>"
  ].join("\n");
}
function save(){
  if(saving || !cryptoKey) return;
  stampHistory(state);
  state.updatedAt = new Date().toISOString();
  saving = true; paintSaveBar();
  clearTimeout(vaultTimer);
  seal(state).then(function(vault){
    writeLocalVault(vault);
    published = clone(state);
    if(!artifactNS || localOnly){
      saving = false; dirty = false; paintSaveBar(); render();
      toast(localOnly ? "この端末に保存した" : "保存した");
      return;
    }
    var nd = { v:1, vault: vault };
    var doc = buildDoc(nd);
    try {
      sessionStorage.setItem(LS + ".justSaved", "1");
      sessionStorage.setItem(LS + ".route", route);
    } catch(e){}
    embedded = nd;
    return publishDoc(doc);
  }).catch(function(){
    saving = false; paintSaveBar();
    toast("保存できなかった。もう一度試して。");
  });
}
function publishDoc(doc){
  return artifactNS.publish(doc).catch(function(err){
    try { sessionStorage.removeItem(LS + ".justSaved"); } catch(e){}
    saving = false; paintSaveBar();
    var code = err && err.code;
    if(code === "conflict"){
      toast("相手が先に保存したみたい。いちど開き直して、最新のほうに入れ直して。");
    } else if(code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared"){
      readOnly = true; render();
      toast("この家計簿は見るだけ。書けるのは、作った人と共有された人だけ。");
    } else if(code === "too_large"){
      toast("中身が大きすぎて保存できなかった。古い記録を減らしてみて。");
    } else if(code === "rate_limited"){
      toast("保存の間隔が短すぎる。少し待ってからもう一度。");
    } else {
      toast("保存できなかった。入れた数字はこの端末に残してある。");
    }
  });
}

function deltaBadge(){
  var h = state.history || [];
  if(h.length < 2) return null;
  var prev = h[h.length - 2], now = h[h.length - 1];
  var d = (now.savings + now.funds - now.debt) - (prev.savings + prev.funds - prev.debt);
  if(Math.abs(d) < 0.05) return el("span", { "class":"delta", text:"前回とほぼ同じ" });
  return el("span", { "class":"delta " + (d > 0 ? "up" : "down"),
    text: (d > 0 ? "▲ +" : "▼ ") + man(d) + "万円（前回から）" });
}
function homeLine(){
  var s = state;
  if(!s.updatedAt) return "まずは「数字を入れる」から。貯蓄の合計だけでも入れれば、ここに全体が出るよ。";
  var net = netWorth(s), debt = totalDebt(s), flow = num(s.income) - num(s.expense);
  if(debt > 0 && net < 0) return "いまは借りているほうが多い。焦らなくていい、毎月の返済で確実に減っている。";
  if(flow < 0) return "毎月の支出が収入を上回っている。まずはここを見直すのが一番効くよ。";
  if(debt > 0) return "純資産はプラス。ローンも毎月ちゃんと減っている。この調子。";
  return "借金なし、貯蓄あり。ふたりでよくやってる。";
}

function loanCard(l){
  var p = payoff(l.balance, l.monthly, l.rate);
  var facts = [];
  if(p.ok && !p.done){
    facts.push(el("dt", { text:"完済まで" }), el("dd", {}, [ el("b", { text: yearsText(p.months) }) ]));
    facts.push(el("dt", { text:"完済予定" }), el("dd", {}, [ el("b", { text: ymPlus(p.months) }) ]));
    facts.push(el("dt", { text:"これから払う利息" }), el("dd", {}, [ el("b", { text: man(p.interest) + "万円" }) ]));
    facts.push(el("dt", { text:"毎月" }), el("dd", { text: man(l.monthly) + "万円（金利 " + (num(l.rate) || 0) + "%）" }));
  }
  /* どこまで返したかは、当初の借入額が分からないと出せない。
     入っていないときはバーを描かずに、数字だけを見せる。 */
  var origin = num(l.origin), bal = num(l.balance);
  var paid = (origin > 0 && origin >= bal) ? (origin - bal) / origin : -1;
  return el("div", { "class":"item" }, [
    el("div", { "class":"item-top" }, [
      el("span", { "class":"item-name", text: l.name || "ローン" }),
      el("span", { "class":"item-num", text: man(l.balance) + "万円" })
    ]),
    paid >= 0 ? el("div", { "class":"bar debt" }, [ el("b", { style:"width:" + Math.round(paid * 100) + "%" }) ]) : null,
    paid >= 0 ? el("p", { "class":"card-s", text:"当初 " + man(origin) + "万円のうち、" + Math.round(paid * 100) + "％ 返しました" }) : null,
    facts.length ? el("dl", { "class":"facts" }, facts) : null,
    (!p.ok && p.why) ? el("p", { "class":"warn", text: p.why + "。毎月返済額と金利を確かめてみて。" }) : null,
    p.done ? el("p", { "class":"card-s", text:"完済ずみ。おつかれさま。" }) : null
  ]);
}
function fundCard(f){
  var goal = num(f.goal), cur = num(f.current), mo = num(f.monthly);
  var pct = goal > 0 ? Math.max(0, Math.min(1, cur / goal)) : 0;
  var facts = [];
  facts.push(el("dt", { text:"目標" }), el("dd", {}, [ el("b", { text: goal ? man(goal) + "万円" : "未設定" }) ]));
  if(goal > cur && mo > 0){
    var months = (goal - cur) / mo;
    facts.push(el("dt", { text:"到達予定" }), el("dd", {}, [ el("b", { text: ymPlus(months) }) ]),
               el("dt", { text:"毎月" }), el("dd", { text: man(mo) + "万円ずつ" }));
  } else if(goal > 0 && cur >= goal){
    facts.push(el("dt", { text:"状態" }), el("dd", {}, [ el("b", { text:"目標を達成" }) ]));
  } else if(mo > 0){
    facts.push(el("dt", { text:"毎月" }), el("dd", { text: man(mo) + "万円ずつ" }));
  }
  return el("div", { "class":"item" }, [
    el("div", { "class":"item-top" }, [
      el("span", { "class":"item-name", text: f.name || "積立" }),
      el("span", { "class":"item-num", text: man(cur) + (goal ? " / " + man(goal) : "") + "万円" })
    ]),
    el("div", { "class":"bar" }, [ el("b", { style:"width:" + Math.round(pct * 100) + "%" }) ]),
    el("dl", { "class":"facts" }, facts)
  ]);
}
/* 貯蓄＋積立とローン残高を、月ごとの折れ線で描く */
function chartSvg(hist){
  var h = hist.slice(-24);
  var W = 640, H = 220, PL = 46, PR = 12, PT = 14, PB = 26;
  var asset = h.map(function(r){ return r.savings + r.funds; });
  var debt = h.map(function(r){ return r.debt; });
  var max = Math.max.apply(null, asset.concat(debt).concat([1]));
  var step = Math.pow(10, Math.floor(Math.log(max) / Math.LN10));
  var top = Math.ceil(max / step) * step;
  var x = function(i){ return PL + (W - PL - PR) * (h.length < 2 ? 0.5 : i / (h.length - 1)); };
  var y = function(v){ return PT + (H - PT - PB) * (1 - v / top); };
  var path = function(arr){
    return arr.map(function(v, i){ return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
  };
  var parts = [];
  [0, 0.5, 1].forEach(function(t){
    var v = top * t;
    parts.push('<line class="g-grid" x1="' + PL + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y(v).toFixed(1) + '"/>');
    parts.push('<text class="g-lab" x="' + (PL - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + Math.round(v) + '</text>');
  });
  h.forEach(function(r, i){
    if(h.length > 8 && i % Math.ceil(h.length / 6) !== 0 && i !== h.length - 1) return;
    var m = r.ym.split("-");
    parts.push('<text class="g-lab" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + Number(m[1]) + '月</text>');
  });
  parts.push('<path class="g-line" stroke="var(--accent)" d="' + path(asset) + '"/>');
  parts.push('<path class="g-line" stroke="var(--tan)" d="' + path(debt) + '"/>');
  var last = h.length - 1;
  parts.push('<circle cx="' + x(last).toFixed(1) + '" cy="' + y(asset[last]).toFixed(1) + '" r="3.5" fill="var(--accent)"/>');
  parts.push('<circle cx="' + x(last).toFixed(1) + '" cy="' + y(debt[last]).toFixed(1) + '" r="3.5" fill="var(--tan)"/>');
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="貯蓄とローンの推移">' + parts.join("") + '</svg>';
  return el("div", { svg: svg });
}

      fundBox.appendChild(el("p", { "class":"empty", text:"まだありません。教育費の積立などがあれば足してください。" }));
      return;
    }
    state.funds.forEach(function(f, i){
      fundBox.appendChild(el("div", { "class":"row" }, [
        el("div", { "class":"row-top" }, [
          el("span", { "class":"row-n", text: pad2(i + 1) }),
          el("span", { "class":"spacer" }),
          el("button", { "class":"del", type:"button", text:"消す", onclick:function(){
            state.funds.splice(i, 1); markDirty(); paintFunds();
          }})
        ]),
        el("div", { "class":"grid2" }, [
          el("div", { "class":"span" }, [ el("span", { "class":"mini-label", text:"名前" }),
            textInput(f.name, function(v){ f.name = v; markDirty(); }, "例：教育費") ]),
          el("div", {}, [ el("span", { "class":"mini-label", text:"いま貯まっている額" }),
            moneyInput(f.current, function(v){ f.current = v; markDirty(); }, "例：120") ]),
          el("div", {}, [ el("span", { "class":"mini-label", text:"目標" }),
            moneyInput(f.goal, function(v){ f.goal = v; markDirty(); }, "例：500") ]),
          el("div", { "class":"span" }, [ el("span", { "class":"mini-label", text:"毎月いくら積む" }),
            moneyInput(f.monthly, function(v){ f.monthly = v; markDirty(); }, "例：3") ])
        ])
      ]));
    });
  }
  paintFunds();

  /* メモ */
  var ta = el("textarea", { "class":"in", rows:"3", placeholder:"来月は車検、など" });
  ta.value = state.note || "";
  ta.addEventListener("input", function(){ state.note = ta.value; markDirty(); });
  form.appendChild(el("div", { style:"margin-top:34px" }, [ field("メモ", "ふたりで共有しておきたいこと。", ta) ]));

  form.appendChild(el("p", { "class":"f-help", style:"margin-top:20px",
    text:"※ 口座番号やパスワードは書かないでください。ここは「いくらあるか」を見る場所です。" }));

  wrap.appendChild(form);
  return wrap;
}

  ]);

/* ---------- 保存バー ---------- */
var saveBarEl = null;
function paintSaveBar(){
  if(saveBarEl){ saveBarEl.remove(); saveBarEl = null; }
  if(locked || readOnly) return;
  if(!dirty && !saving) return;
  var btn = el("button", { "class":"btn btn-solid", type:"button",
    text: saving ? "保存している…" : "保存する", disabled: saving ? true : null, onclick: save });
  saveBarEl = el("div", { "class":"savebar" }, [
    el("div", { "class":"savebar-in" }, [
      el("span", { "class":"savebar-t", text: saving ? "保存しています" : "書きかえたところがあります" }),
      btn
    ])
  ]);
  document.body.appendChild(saveBarEl);
}

function render(){
  root.textContent = "";
  if(!hasCrypto()){ root.appendChild(noCryptoView()); return; }
  if(locked){ root.appendChild(lockView()); paintSaveBar(); return; }
  root.appendChild(topbar());
  root.appendChild(route === "edit" ? editView() : homeView());
  if(localOnly){
    var b = el("div", { "class":"wrap" }, [
      el("p", { "class":"f-help", text:"いまは共有できない開き方です。書いた内容はこの端末にだけ残ります。" })
    ]);
    root.appendChild(b);
  }
  paintSaveBar();
}

/* =======================================================================
   施錠・解錠
   ======================================================================= */
function lockNow(quiet){
  cryptoKey = null; locked = true; lockMode = "unlock"; lockErr = "";
  state = emptyState(); published = emptyState();
  dirty = false; saving = false; route = "home";
  clearTimeout(vaultTimer);
  dropKey();
  closeSheet();
  render();
  if(!quiet) toast("鍵をかけた");
}
function afterUnlock(data, key){
  cryptoKey = key;
  state = normalize(data);
  published = clone(state);
  locked = false; lockErr = ""; dirty = false;
  touch();
  startIdleWatch();
  render();
}
function doSetup(pass, hint){
  var salt = window.crypto.getRandomValues(new Uint8Array(16));
  currentSalt = b64(salt);
  return deriveKey(pass, salt, PBKDF2_ITER).then(function(key){
    cryptoKey = key;
    return seal(emptyState()).then(function(v){
      writeLocalVault(v);
      writeHint(hint || "");
      return persistKey(key).then(function(){ afterUnlock(emptyState(), key); });
    });
  });
}
/* 手元と、ページに埋まっているぶんの両方を試す（片方だけ新しいことがある）。 */
function candidates(){
  var lv = localVault(), ev = embeddedVault();
  var c = (lv && ev) ? ((lv.at || 0) >= (ev.at || 0) ? [lv, ev] : [ev, lv]) : [lv || ev];
  return c.filter(Boolean);
}
function tryUnlock(pass){
  var cands = candidates();
  if(!cands.length) return Promise.reject(new Error("no-vault"));
  function attempt(i){
    if(i >= cands.length) return Promise.reject(new Error("bad-pass"));
    var v = cands[i];
    return deriveKey(pass, unb64(v.salt), v.iter || PBKDF2_ITER).then(function(key){
      return unseal(v, key).then(function(data){
        currentSalt = v.salt;
        return persistKey(key).then(function(){ afterUnlock(data, key); });
      }, function(){ return attempt(i + 1); });
    });
  }
  return attempt(0);
}
function touch(){
  lastAct = Date.now();
  if(cryptoKey){
    try {
      var o = JSON.parse(sessionStorage.getItem(SKEY) || "null");
      if(o){ o.until = Date.now() + IDLE_MS; sessionStorage.setItem(SKEY, JSON.stringify(o)); }
    } catch(e){}
  }
}
function startIdleWatch(){
  if(idleTimer) return;
  idleTimer = setInterval(function(){
    if(!locked && Date.now() - lastAct > IDLE_MS){ lockNow(true); toast("1時間さわらなかったので、鍵をかけた"); }
  }, 30000);
}
["pointerdown","keydown","wheel","touchstart"].forEach(function(ev){
  window.addEventListener(ev, function(){ if(!locked) touch(); }, { passive:true });
});
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible") return;
  if(!locked && Date.now() - lastAct > IDLE_MS){ lockNow(true); toast("1時間さわらなかったので、鍵をかけた"); }
  else if(!locked) touch();
});

function lockView(){
  var setup = lockMode === "setup";
  var wrap = el("main", { "class":"wrap lockwrap" });
  var pass = el("input", { "class":"in", type:"password", inputmode:"numeric",
    autocomplete: setup ? "new-password" : "current-password",
    placeholder: setup ? "4文字以上" : "暗証番号", "aria-label":"暗証番号" });
  var pass2 = setup ? el("input", { "class":"in", type:"password", autocomplete:"new-password",
    placeholder:"もう一度", "aria-label":"暗証番号（確認）" }) : null;
  var hint = setup ? el("input", { "class":"in", type:"text", placeholder:"ヒント（任意・暗証番号そのものは書かない）" }) : null;
  var agree = setup ? el("input", { type:"checkbox", id:"agree-lost" }) : null;
  var err = el("p", { "class":"lockerr", hidden: lockErr ? null : "", text: lockErr });
  var btn = el("button", { "class":"btn btn-solid btn-lg", type:"button",
    text: setup ? "この暗証番号にする" : "ひらく" });

  function submit(){
    if(lockBusy) return;
    var p = pass.value;
    if(setup){
      if(p.length < 4){ show("4文字以上にして。"); return; }
      if(p !== pass2.value){ show("2つが一致していない。"); return; }
      if(!agree.checked){ show("忘れたときのことを確認して、チェックを入れて。"); return; }
    } else if(!p){ show("暗証番号を入れて。"); return; }
    lockBusy = true; btn.disabled = true; btn.textContent = "確かめている…";
    var work = setup ? doSetup(p, hint.value.trim()) : tryUnlock(p);
    work.then(function(){ lockBusy = false; }, function(e){
      lockBusy = false; btn.disabled = false;
      btn.textContent = setup ? "この暗証番号にする" : "ひらく";
      show(e && e.message === "no-vault" ? "保存されたものが見つからない。" : "暗証番号が違う。");
      pass.value = ""; pass.focus();
    });
  }
  function show(m){ lockErr = m; err.textContent = m; err.hidden = false; }
  btn.addEventListener("click", submit);
  [pass, pass2, hint].forEach(function(i){
    if(i) i.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
  });
  setTimeout(function(){ pass.focus(); }, 80);

  var h = readHint();
  var img = akari(74, setup ? "smile" : "normal");
  wrap.appendChild(el("div", { "class":"lockcard" }, [
    img ? el("span", { svg: img }) : null,
    el("h1", { "class":"lock-t", text: setup ? "暗証番号を決める" : TITLE }),
    el("p", { "class":"lock-s", text: setup
      ? "この番号で中身を暗号化します。番号を知らない人には、意味のない文字列にしか見えません。"
      : "暗証番号を入れると開きます。" }),
    (!setup && h) ? el("p", { "class":"lock-hint", text:"ヒント： " + h }) : null,
    pass, pass2, hint,
    setup ? el("label", { "class":"lock-agree", for:"agree-lost" }, [
      agree, el("span", { text:"忘れたら中身は二度と読めなくなることを理解した。紙に書いて保管する。" })
    ]) : null,
    err, btn,
    setup ? el("p", { "class":"lock-note",
      text:"この番号はふたりで共有するものです。相手にも必ず伝えてください。" }) : null
  ]));
  return wrap;
}
function noCryptoView(){
  var img = akari(74, "surprise");
  return el("main", { "class":"wrap lockwrap" }, [
    el("div", { "class":"lockcard" }, [
      img ? el("span", { svg: img }) : null,
      el("h1", { "class":"lock-t", text:"この開き方では鍵が使えない" }),
      el("p", { "class":"lock-s", text:"暗証番号による保護には、暗号化の仕組み（Web Crypto）が要ります。この環境では使えないため、中身を開きません。https のURLから開き直してください。" })
    ])
  ]);
}

/* =======================================================================
   起動
   ======================================================================= */
function enterLocalOnly(){ localOnly = true; if(!locked) render(); }

function boot(){
  try { embedded = JSON.parse(document.getElementById("note-data").textContent) || {}; } catch(e){ embedded = {}; }
  if(!hasCrypto()){ render(); return; }

  var justSaved = false, wantRoute = null;
  try {
    if(sessionStorage.getItem(LS + ".justSaved")){ justSaved = true; sessionStorage.removeItem(LS + ".justSaved"); }
    wantRoute = sessionStorage.getItem(LS + ".route");
    sessionStorage.removeItem(LS + ".route");
  } catch(e){}

  var haveVault = candidates().length > 0;
  lockMode = haveVault ? "unlock" : "setup";
  render();

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){ artifactNS = ns; if(!ns) enterLocalOnly(); }, function(){ enterLocalOnly(); });
  } else enterLocalOnly();

  if(!haveVault) return;
  restoreKey().then(function(key){
    if(!key) return;
    var cands = candidates();
    (function attempt(i){
      if(i >= cands.length){ dropKey(); return; }
      unseal(cands[i], key).then(function(data){
        currentSalt = cands[i].salt;
        afterUnlock(data, key);
        if(wantRoute){ route = wantRoute; render(); }
        if(justSaved) toast("保存した");
      }, function(){ attempt(i + 1); });
    })(0);
  });
}

window.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeSheet();
  if((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); if(dirty) save(); }
});
window.addEventListener("beforeunload", function(e){ if(dirty && !saving){ e.preventDefault(); e.returnValue = ""; } });

boot();
})();
</script>
